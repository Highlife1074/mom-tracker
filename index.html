<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Riviera Tower — Project Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCs-tnK2RfDn9I1gDTZNwMs3hkyNghDbRo",
    authDomain: "rt-mom.firebaseapp.com",
    projectId: "rt-mom",
    storageBucket: "rt-mom.firebasestorage.app",
    messagingSenderId: "210967214795",
    appId: "1:210967214795:web:c4ccc7b00fb7039b57f94e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = {
    get: async (key) => {
      try { const snap = await getDoc(doc(db,"mom_data",key)); return snap.exists()?snap.data().value:null; }
      catch(e){ console.error("FB get",e); return null; }
    },
    set: async (key, value) => {
      try { await setDoc(doc(db,"mom_data",key),{value}); }
      catch(e){ console.error("FB set",e); }
    }
  };

  // Real-time listener helper
  window._dbListen = function(key, cb){
    return onSnapshot(doc(db,"mom_data",key), function(snap){
      if(snap.exists()) cb(snap.data().value);
    });
  };

  window._dbReady = true;
  window.dispatchEvent(new Event("db-ready"));
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#f8f7f3;color:#222;}
.btn{background:#c9a84c;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;}
.btn:hover{background:#b8973b;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-danger{background:#d32f2f;}
.btn-danger:hover{background:#b71c1c;}
input,select,textarea{font-family:'Inter',sans-serif;padding:6px 10px;border:1px solid #ddd;border-radius:5px;font-size:13px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#c9a84c;}
textarea{resize:vertical;min-height:60px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #eee;}
.tbl th{background:#f5f4f0;font-weight:600;}
.tbl tr:hover{background:#fafaf8;}
.modal{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.15);max-width:90vw;max-height:90vh;overflow:auto;}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee;}
.modal-title{font-size:16px;font-weight:700;}
.modal-body{padding:20px;}
.modal-footer{padding:12px 20px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px;}
.frow{display:flex;gap:12px;}
.frow .fg{flex:1;}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  function showErr(title,msg,stk){
    var pre=document.createElement("pre");
    pre.style.cssText="padding:24px;font-family:monospace;color:#c62828;white-space:pre-wrap;font-size:13px;background:#fff;margin:0";
    pre.textContent=title+":\n"+msg+"\n\nStack:\n"+(stk||"");
    document.body.innerHTML="";
    document.body.appendChild(pre);
  }
  function run(){
    fetch("app.js?v="+Date.now())
      .then(function(r){return r.text();})
      .then(function(src){
        try{
          var out=Babel.transform(src,{presets:["react"]}).code;
          eval(out);
        }catch(e){
          showErr("BABEL ERROR",e.message,e.stack);
        }
      })
      .catch(function(e){showErr("FETCH ERROR",e.message,"");});
  }
  function wait(){
    if(typeof Babel!=="undefined"&&typeof React!=="undefined"&&typeof ReactDOM!=="undefined"){
      if(window._dbReady)run();
      else window.addEventListener("db-ready",run,{once:true});
    }else setTimeout(wait,50);
  }
  window.addEventListener("error",function(e){
    var root=document.getElementById("root");
    if(!root||root.innerHTML===""){
      showErr("RUNTIME ERROR",(e.message||"Unknown")+"\nFile: "+(e.filename||"")+" L"+(e.lineno||""),(e.error&&e.error.stack)||"");
    }
  });
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",wait):wait();
})();
</script>
</body>
</html>
