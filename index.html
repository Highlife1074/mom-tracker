<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCs-tnK2RfDn9I1gDTZNwMs3hkyNghDbRo",
    authDomain: "rt-mom.firebaseapp.com",
    projectId: "rt-mom",
    storageBucket: "rt-mom.firebasestorage.app",
    messagingSenderId: "210967214795",
    appId: "1:210967214795:web:c4ccc7b00fb7039b57f94e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose db helpers globally for Babel/React code
  window._db = {
    get: async (key) => {
      try {
        const snap = await getDoc(doc(db, "mom_data", key));
        return snap.exists() ? snap.data().value : null;
      } catch(e) { console.error("FB get error", e); return null; }
    },
    set: async (key, value) => {
      try {
        await setDoc(doc(db, "mom_data", key), { value });
      } catch(e) { console.error("FB set error", e); }
    }
  };
  window._dbReady = true;
  window.dispatchEvent(new Event("db-ready"));
</script>

<style>

<script id="app-source" type="text/plain">
const {useState,useEffect,useRef,useCallback}=React;

// ── Firebase storage (cloud) ──────────────────────────────────
const cloudStore = {
  get: async (key) => {
    if (!window._db) return null;
    const val = await window._db.get(key);
    if (val === null) return null;
    try { return typeof val === 'string' ? JSON.parse(val) : val; } catch { return val; }
  },
  set: async (key, value) => {
    if (!window._db) return;
    await window._db.set(key, JSON.stringify(value));
  }
};

const SK="records"; const LK="library"; const VK="groups"; const TK="tasks"; const PK="people"; const GK="tags"; const RK="tagrules"; const QK="pkgrules"; const XK="trackers"; const DK="tenders";
const TENDER_STEPS=[
  {key:"acc",label:"ACC / Aconex",opts:["À faire","Signature interne","Signature client","Approuvé","À refaire"]},
  {key:"contrat",label:"Contrat",opts:["Request to do","Request done","Contract to do","Contract to be signed","Signé"]},
  {key:"mar",label:"MAR",opts:["Not done","Done","On Aconex","Approved A","Approved B","Not approved"]},
  {key:"itp",label:"ITP",opts:["Not done","Done","On Aconex","Approved A","Approved B","Not approved"]},
  {key:"wms",label:"WMS",opts:["Not done","Done","On Aconex","Approved A","Approved B","Not approved"]}
];
const TENDER_COLORS={
  "Approuvé":"#e8f5e9|#2e7d32","Approved A":"#e8f5e9|#2e7d32","Approved B":"#e0f2f1|#00796b",
  "Done":"#e8f5e9|#2e7d32","Signature client":"#e3f2fd|#1565c0","Contract to be signed":"#e3f2fd|#1565c0",
  "Signé":"#e8f5e9|#2e7d32","On Aconex":"#e3f2fd|#1565c0",
  "À faire":"#fff8e1|#f57f17","Request to do":"#fff8e1|#f57f17","Not done":"#fafafa|#aaa",
  "À refaire":"#fce4ec|#c62828","Not approved":"#fce4ec|#c62828",
  "Signature interne":"#f3e5f5|#7b1fa2","Request done":"#f3e5f5|#7b1fa2",
  "Contract to do":"#fff3e0|#e65100"
};
function tenderStepColor(val){const p=(TENDER_COLORS[val]||"#f5f4f0|#888").split("|");return{bg:p[0],color:p[1]};}
function newTenderRow(){return{id:uuid(),name:"",resp:"",acc:"",contrat:"",mar:"",itp:"",wms:"",note:""};}
function newTender(){return{id:uuid(),title:"",createdAt:new Date().toISOString().slice(0,10),description:"",hiddenSteps:[],rows:[newTenderRow()]};}

const DIRECTIONS=["outgoing","incoming_boss","incoming_dept"];
const DIR_LABELS={outgoing:"📤 Sent to Team",incoming_boss:"📥 From Boss",incoming_dept:"🔄 From Department"};
const DIR_COLORS={outgoing:{bg:"#e8f5e9",accent:"#2e7d32",badge:"#c8e6c9"},incoming_boss:{bg:"#e3f2fd",accent:"#1565c0",badge:"#bbdefb"},incoming_dept:{bg:"#fff3e0",accent:"#e65100",badge:"#ffe0b2"}};
const STATUS_OPTIONS=["pending","in progress","done","blocked"];
const STATUS_ICONS={pending:"⏳","in progress":"🔄",done:"✅",blocked:"🚫"};
// ── Importance × Urgence → Score 1-9 ─────────────────────────
// importance: 1=low 2=medium 3=high  urgence: 1=low 2=medium 3=high
// score = importance × urgence (1–9)
function calcScore(imp,urg){return (imp||1)*(urg||1);}
function scoreStyle(s){
  if(s>=7) return {bg:"#ffeaea",color:"#c62828",label:`🔥 ${s}`,border:"#c62828"};
  if(s>=4) return {bg:"#fff8e1",color:"#f57f17",label:`⚡ ${s}`,border:"#f57f17"};
  return      {bg:"#f5f4f0",color:"#888",   label:`${s}`,border:"#ddd"};
}
const IMP_LABELS=["","Importance 1","Importance 2","Importance 3"];
const URG_LABELS=["","Urgence 1","Urgence 2","Urgence 3"];
const OWNER_COLORS=[{bg:"#e8eaf6",accent:"#3949ab"},{bg:"#fce4ec",accent:"#c2185b"},{bg:"#e0f2f1",accent:"#00796b"},{bg:"#fff3e0",accent:"#e65100"},{bg:"#f3e5f5",accent:"#7b1fa2"},{bg:"#e1f5fe",accent:"#0277bd"},{bg:"#f9fbe7",accent:"#827717"},{bg:"#fbe9e7",accent:"#bf360c"}];
function ownerColor(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%OWNER_COLORS.length;return OWNER_COLORS[h];}
function uuid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});}

const SEED_LIBRARY=["Acoustic Ceiling & Panels — Kvadras","AVRA Stone","Brickworks","Brushed Concrete","Concrete Blocks","Cover for Manholes","EPS","Exposed Aggregates","Fence","Fire Joint","Glazed Door","Granite","Grolla / Pool","Joinery LO","Manholes","Mirror Ceiling","MOCA","Open Channels","Paint","Plastering","Playground","Rainwater Channel & Other Channels","Repair Car Park","Resilient Flooring","SFS in Lobby","Special Paint","Stabilised Earth","Stone","Technical Wooden Floor","Threads","Trims","Waterproofing","Wood Flooring","Wooden Door","Wooden False Ceiling & Panels"].sort();
const SEED_PEOPLE=["BALLAS, Antonios","CHATZIROUMPIS, Vasilis","FYTOPOULOU, Katerina","KLEFTOSPYROU, Georgia","KOUTOULAKI, Anna","MAKROVASILI, Anastasia","NASIS, Athanasios","PLOUMISTOS, Georgios Paraskevas","ROSIOS, Irodion","ROUSSIN, Yanis","TSIAMPAOS, Konstantinos","VRETTOU, Eirini"].sort();
const SEED_TAGS=["Contract","Design","HR","Procurement","Production"].sort();
const TAG_COLORS=["#e8eaf6|#3949ab","#fce4ec|#c2185b","#e0f2f1|#00796b","#fff3e0|#e65100","#f3e5f5|#7b1fa2","#e8f5e9|#2e7d32","#fff8e1|#f57f17","#fbe9e7|#bf360c","#e3f2fd|#1565c0","#f9fbe7|#827717"];
function tagColor(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%TAG_COLORS.length;const parts=TAG_COLORS[h].split("|");return{bg:parts[0],color:parts[1]};}

const newTask=()=>({id:uuid(),text:"",owner:"",package:"",status:"pending",importance:1,urgence:1,due:"",note:"",photos:[],tags:[],createdAt:new Date().toISOString().slice(0,10)});
const newPkg=()=>({id:uuid(),name:"",owner:"",actions:[{id:uuid(),text:"",status:"pending",due:"",photos:[],tags:[],importance:1,urgence:1,details:"",isTender:false,tenderSteps:{},tenderRef:""}]});
const defForm={title:"",date:new Date().toISOString().slice(0,10),direction:"outgoing",participants:"",summary:"",packages:[newPkg()]};

// ── InlineTagAdd — add a new tag directly from PkgForm ──────────
function InlineTagAdd({onAdd}){
  const [show,setShow]=useState(false);
  const [val,setVal]=useState("");
  const ref=useRef();
  useEffect(()=>{if(show&&ref.current)ref.current.focus();},[show]);
  if(!show) return <button onClick={()=>setShow(true)}
    style={{padding:"2px 8px",borderRadius:20,border:"1.5px solid #e0ddd6",background:"#fff",color:"#bbb",fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer"}}>＋ tag</button>;
  return <span style={{display:"inline-flex",alignItems:"center",gap:3}}>
    <input ref={ref} type="text" value={val} onChange={e=>setVal(e.target.value)}
      onKeyDown={e=>{
        if(e.key==="Enter"&&val.trim()){onAdd(val.trim());setVal("");setShow(false);}
        if(e.key==="Escape"){setShow(false);setVal("");}
      }}
      placeholder="New tag…"
      style={{padding:"2px 7px",border:"1.5px solid #1c1c1e",borderRadius:20,fontFamily:"inherit",fontSize:11,outline:"none",width:90}}/>
    <button onClick={()=>{if(val.trim()){onAdd(val.trim());setVal("");setShow(false);}}}
      style={{padding:"2px 7px",borderRadius:20,background:"#1c1c1e",color:"#fff",border:"none",fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer"}}>✓</button>
    <button onClick={()=>{setShow(false);setVal("");}}
      style={{padding:"2px 5px",borderRadius:20,background:"none",color:"#bbb",border:"1px solid #ddd",fontFamily:"inherit",fontSize:11,cursor:"pointer"}}>✕</button>
  </span>;
}


// ── TenderPicker — link action to a Tender ──────────────────────
function TenderPicker({value,onChange,tenders}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  const opts=tenders.map(t=>t.title).filter(t=>t.toLowerCase().includes(q.toLowerCase()));
  return <div ref={ref} style={{position:"relative",display:"inline-block",minWidth:140}}>
    <div onClick={()=>setOpen(!open)} style={{display:"flex",alignItems:"center",gap:4,padding:"3px 8px",border:"1.5px solid "+(value?"#b45309":"#ddd"),borderRadius:20,background:value?"#fff8f0":"#fff",cursor:"pointer",fontSize:11,fontWeight:700,color:value?"#b45309":"#bbb"}}>
      <span>📑 {value||"Link Tender"}</span>
      <span style={{fontSize:9,color:"#bbb",marginLeft:2}}>▾</span>
    </div>
    {open&&<div style={{position:"absolute",top:"100%",left:0,zIndex:100,background:"#fff",border:"1.5px solid #e8e6df",borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,.12)",minWidth:200,marginTop:4,padding:6}}>
      <input autoFocus type="text" placeholder="Search or type Tender name…" value={q} onChange={e=>setQ(e.target.value)}

          onMouseEnter={e=>e.currentTarget.style.background="#f5f4f0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>

// ── APP ──────────────────────────────────────────────────────────
function App(){

  const [trackers,setTrackers]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [library,setLibrary]=useState([]);
  const [people,setPeople]=useState([]);

  const [tenders,setTenders]=useState([]);

  const [showGroups,setShowGroups]=useState(false);
  const [loaded,setLoaded]=useState(false);

  const [view,setView]=useState("dashboard");
  const [selected,setSelected]=useState(null);
  const [form,setForm]=useState(defForm);
  const [editMode,setEditMode]=useState(false);
  const [activeTab,setActiveTab]=useState("packages");
  const [showLib,setShowLib]=useState(false);
  const [showPpl,setShowPpl]=useState(false);
  const [showTags,setShowTags]=useState(false);
  const [trackerForm,setTrackerForm]=useState(null); // null=hidden, {}=new, {id,...}=edit
  const [selTracker,setSelTracker]=useState(null);
  const [showBak,setShowBak]=useState(false);
  const [showEmail,setShowEmail]=useState(false);
  const [showEmailOut,setShowEmailOut]=useState(false);
  const [emailSource,setEmailSource]=useState(null); // null = use filtA, otherwise array of actions
  const [scoreEditMode,setScoreEditMode]=useState(false);
  const [editingAction,setEditingAction]=useState(null); // {id, source, meetingId, pkgId, text, due, tags, tenderRef}
  const [libSearch,setLibSearch]=useState("");
  const [libDel,setLibDel]=useState(null);
  const [taskForm,setTaskForm]=useState(null);
  const [lightbox,setLightbox]=useState(null);
  const [taskFil,setTaskFil]=useState({status:"all",owner:"all",pkg:"all",score:"all",q:""});
  const [fOwner,setFOwner]=useState("all");
  const [fCC,setFCC]=useState("all");
  const [fPkg,setFPkg]=useState("all");
  const [fTag,setFTag]=useState("all");
  const [fScore,setFScore]=useState("all");
  const [fStatus,setFStatus]=useState("all");
  const [fDir,setFDir]=useState("all");
  const [fTender,setFTender]=useState("all");
  const [fTenderRef,setFTenderRef]=useState("all");
  const [fGroup,setFGroup]=useState("all");
  const [fText,setFText]=useState("");

  // Wait for Firebase then load
  useEffect(()=>{
    const load=async()=>{
      try {
        const [r,l,t,p,g,rv,qv,xv,dv,vv]=await Promise.all([cloudStore.get(SK),cloudStore.get(LK),cloudStore.get(TK),cloudStore.get(PK),cloudStore.get(GK),cloudStore.get(RK),cloudStore.get(QK),cloudStore.get(XK),cloudStore.get(DK),cloudStore.get(VK)]);
        // Normalize importance/urgence on existing data that predates this feature
        const normAc=ac=>({importance:1,urgence:1,...ac});
        const normPkgs=pkgs=>(pkgs||[]).map(p=>({...p,actions:(p.actions||[]).map(normAc)}));
        const rNorm=(r||[]).map(rec=>({...rec,packages:normPkgs(rec.packages)}));
        const tNorm=(t||[]).map(tk=>({importance:1,urgence:1,...tk}));
        const xNorm=(xv||[]).map(tr=>({...tr,packages:normPkgs(tr.packages)}));
        setRecords(rNorm);setLibrary(l||SEED_LIBRARY);setTasks(tNorm);setPeople(p||SEED_PEOPLE);setTags(g||SEED_TAGS);setRules(rv||{});setPkgRules(qv||{});setTrackers(xNorm);setTenders(dv||[]);if(vv)setPersonGroups(vv);
        if(!l) await cloudStore.set(LK,SEED_LIBRARY);
        if(!p) await cloudStore.set(PK,SEED_PEOPLE);
        if(!g) await cloudStore.set(GK,SEED_TAGS);
      } catch(e){ console.error(e); setLibrary(SEED_LIBRARY); setPeople(SEED_PEOPLE); }
      setLoaded(true);
    };
    if(window._dbReady) load();
    else window.addEventListener("db-ready",load,{once:true});
  },[]);

  const sync=async(key,val)=>{
    setSyncStatus("syncing");
    try{ await cloudStore.set(key,val); setSyncStatus("ok"); }
    catch(e){ console.error(e); setSyncStatus("error"); }
  };

  const saveR=d=>{setRecords(d);sync(SK,d);};
  const saveT=d=>{setTasks(d);sync(TK,d);};
  const saveX=d=>{setTrackers(d);sync(XK,d);};
  const saveD=d=>{setTenders(d);sync(DK,d);};
  const saveV=d=>{setPersonGroups(d);sync(VK,d);};
  const saveL=d=>{setLibrary(d);sync(LK,d);};
  const saveP=d=>{setPeople(d);sync(PK,d);};
  const saveG=d=>{setTags(d);sync(GK,d);};
  const saveRules=d=>{setRules(d);sync(RK,d);};
  const savePkgRules=d=>{setPkgRules(d);sync(QK,d);};
  const addLib=n=>{if(!library.includes(n)){const u=[...library,n].sort((a,b)=>a.localeCompare(b));saveL(u);}};
  const addPpl=n=>{if(!people.includes(n)){const u=[...people,n].sort((a,b)=>a.localeCompare(b));saveP(u);}};
  const addTag=n=>{if(!tags.includes(n)){const u=[...tags,n].sort((a,b)=>a.localeCompare(b));saveG(u);}};
  const remLib=n=>{saveL(library.filter(p=>p!==n));setLibDel(null);};
  const renLib=(o,nw)=>{if(!nw.trim()||library.includes(nw.trim()))return;saveL(library.map(p=>p===o?nw.trim():p).sort((a,b)=>a.localeCompare(b)));};
  // CCs from tags
  const getCCs=tagList=>[...new Set((tagList||[]).flatMap(t=>rules[t]||[]))];
  // CCs from package name
  const getPkgCCs=pkgName=>[...new Set(pkgRules[pkgName]||[])];
  const momA=records.flatMap(r=>(r.packages||[]).flatMap(p=>(p.actions||[]).map(a=>({...a,package:p.name,owner:p.owner,pkgId:p.id,meetingTitle:r.title,meetingId:r.id,direction:r.direction,source:"mom"}))));
  const taskA=tasks.map(t=>({...t,meetingTitle:"— Task —",meetingId:null,source:"task"}));
  const trackerA=trackers.flatMap(tr=>(tr.packages||[]).flatMap(p=>(p.actions||[]).map(a=>({...a,package:p.name,owner:p.owner,pkgId:p.id,meetingTitle:tr.title,meetingId:tr.id,direction:"tracker",source:"tracker"}))));
  const allA=[...momA,...taskA,...trackerA];
  const allOwners=[...new Set(allA.map(a=>a.owner))].filter(Boolean).sort();
  const allPkgs=[...new Set(allA.map(a=>a.package))].filter(Boolean).sort();
  // All people who appear as CC on at least one action (excluding owners)
  const allCCPersons=[...new Set(allA.flatMap(a=>[...getCCs(a.tags||[]),...getPkgCCs(a.package||"")].filter(p=>p!==a.owner)))].filter(Boolean).sort();
  const pCount=allA.filter(a=>a.status==="pending").length;
  const dCount=allA.filter(a=>a.status==="done").length;
  const bCount=allA.filter(a=>a.status==="blocked").length;
  const ipCount=allA.filter(a=>a.status==="in progress").length;

  const resetF=()=>{setFOwner("all");setFCC("all");setFPkg("all");setFTag("all");setFScore("all");setFStatus("all");setFDir("all");setFTender("all");setFTenderRef("all");setFGroup("all");setFText("");};
  const afCount=[fOwner,fCC,fPkg,fTag,fScore,fStatus,fDir,fTender,fTenderRef,fGroup].filter(f=>f!=="all").length+(fText?1:0);

  const filtA=allA.filter(a=>{
    if(fOwner!=="all"){
      const acCCs=[...getCCs(a.tags||[]),...getPkgCCs(a.package||"")];
      if(a.owner!==fOwner && !acCCs.includes(fOwner)) return false;
    }
    if(fCC!=="all"){
      const acCCs=[...getCCs(a.tags||[]),...getPkgCCs(a.package||"")];
      if(!acCCs.includes(fCC)) return false;

  function EmailOutModal(){
    const [copied,setCopied]=useState(false);
    const actions=emailSource||filtA;
    const sourceLabel=emailSource?"Ce document":"active filters";

    const fmtDate=d=>{if(!d)return"";const p=d.split("-");if(p.length!==3)return d;return p[2]+"/"+p[1]+"/"+p[0].slice(2);};
    const buildEmail=()=>{
      const today=new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
      const bySource={};
      actions.forEach(ac=>{
        const key=ac.source==="task"?"📌 Standalone tasks":ac.source==="tracker"?"📊 "+ac.meetingTitle:ac.meetingTitle;
        if(!bySource[key]) bySource[key]=[];
        bySource[key].push(ac);
      });

      const filterDesc=[];
      if(!emailSource){
        if(fOwner!=="all") filterDesc.push(fOwner);
        if(fPkg!=="all") filterDesc.push(fPkg);
        if(fTag!=="all") filterDesc.push("["+fTag+"]");
        if(fStatus!=="all") filterDesc.push(fStatus);
      } else if(emailSource.length>0){
        filterDesc.push(emailSource[0].meetingTitle||"");
      }
      const subject=filterDesc.length>0
        ?"Action tracking — "+filterDesc.join(" · ")+" — "+today
        :"Action tracking — "+today;

      let body="Hello,\n\nPlease find below the action summary"+(filterDesc.length>0?" ("+filterDesc.join(", ")+")":"")+" as of "+today+".\n\n";
      body+="─".repeat(60)+"\n\n";

      Object.entries(bySource).forEach(function(entry){
        const src=entry[0];
        const srcActions=entry[1];
        body+=src+"\n"+"─".repeat(src.length)+"\n\n";
        const byPkg={};
        srcActions.forEach(ac=>{
          const k=ac.package||"—";
          if(!byPkg[k]) byPkg[k]=[];
          byPkg[k].push(ac);
        });
        Object.entries(byPkg).forEach(function(pe){
          const pkg=pe[0];
          const acts=pe[1];
          if(pkg!=="—") body+="  📦 "+pkg+"\n";
          acts.forEach(ac=>{
            const status={"pending":"⏳","in progress":"🔄","done":"✅","blocked":"🚫"}[ac.status]||"•";
            const ownerName=ac.owner?ac.owner.split(",")[0]:"";
            const owner=ownerName?" @"+ownerName:"";
            const dueDate=ac.due?fmtDate(ac.due):"";
            const due=dueDate?" → "+dueDate:"";
            const tags=(ac.tags||[]).length>0?" ["+ac.tags.join(", ")+"]":"";
            const sc=calcScore(ac.importance||1,ac.urgence||1);
            const scoreLabel=sc>=9?"🔴 "+sc:sc>=6?"🟠 "+sc:sc>1?""+sc:"";
            const scoreStr=scoreLabel?" [Score: "+scoreLabel+"]":"";
            const ccs=[...getCCs(ac.tags||[]),...getPkgCCs(ac.package||"")].filter((v,i,a)=>a.indexOf(v)===i);
            const ccStr=ccs.length>0?" "+ccs.map(p=>"@"+p.split(",")[0]).join(" "):"";
            const details=ac.details?" — "+ac.details:"";
            const tref=ac.tenderRef?" [📑 "+ac.tenderRef+"]":"";
            body+="    "+status+" "+ac.text+owner+due+scoreStr+tags+ccStr+tref+details+"\n";
          });
          body+="\n";
        });
      });

      body+="─".repeat(60)+"\n";
      body+="Total: "+actions.length+" action"+(actions.length>1?"s":"")+" · Generated "+today+"\n";
      return {subject,body};
    };

    const {subject,body}=buildEmail();
    const full=`Objet : ${subject}\n\n${body}`;

    const copy=()=>{
      navigator.clipboard.writeText(full).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
    };

    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget){setShowEmailOut(false);setEmailSource(null);}}}>
      <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:680,maxHeight:"88vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}>
        <div style={{padding:"18px 22px 14px",borderBottom:"1.5px solid #e8e6df",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18}}>📋 Follow-up email</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:3}}>{actions.length} action{actions.length>1?"s":""} · {sourceLabel}</div>
          </div>
          <button onClick={()=>{setShowEmailOut(false);setEmailSource(null);}} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#bbb",flexShrink:0}}>×</button>
        </div>
        <div style={{padding:"14px 22px 8px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:".5px",marginBottom:4}}>Objet</div>
          <div style={{padding:"8px 12px",background:"#f5f4f0",borderRadius:8,fontSize:13,fontWeight:600,color:"#1a1a1a"}}>{subject}</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 22px 14px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:".5px",marginBottom:4}}>Message body</div>
          <textarea readOnly value={body}
            style={{width:"100%",height:"100%",minHeight:320,padding:"12px 14px",border:"1.5px solid #e8e6df",borderRadius:10,fontFamily:"'Courier New',monospace",fontSize:12,lineHeight:1.7,resize:"none",background:"#fafaf8",color:"#1a1a1a",outline:"none"}}/>
        </div>
        <div style={{padding:"12px 22px 18px",borderTop:"1.5px solid #e8e6df",display:"flex",gap:8,justifyContent:"flex-end",alignItems:"center"}}>
          <span style={{fontSize:12,color:"#aaa",flex:1}}>Collez directement dans Outlook, Gmail, Teams…</span>
          <button className="btn bout" onClick={()=>setShowEmailOut(false)}>Fermer</button>
          <button className="btn bpri" onClick={copy} style={{minWidth:160,justifyContent:"center",background:copied?"#2e7d32":"#1c1c1e"}}>
            {copied?"✅ Copied!":"📋 Copy all"}
          </button>
        </div>
      </div>
    </div>;
  }

  const syncLabel={ok:"☁️",syncing:"⏳",error:"⚠️"}[syncStatus];

        <button className="nb lib" onClick={()=>setShowTags(true)}>🏷️ {tags.length}</button>
        <button className="nb bkp" onClick={()=>setShowBak(true)}>💾 Backup</button>
        <button className="nb email-cta" onClick={()=>setShowEmail(true)}>📧 Email</button>

        <button className="nb" style={{background:"#00796b",color:"#fff",fontWeight:700}} onClick={()=>setTrackerForm(newTrackerForm())}>＋ Tracker</button>
        <button className="nb" style={{background:"#b45309",color:"#fff",fontWeight:700}} onClick={()=>setTenderForm(newTender())}>＋ Tender</button>

    <div className="main">

      {view==="dashboard"&&<div>

        <div className="stats">
          <div className="sc"><div className="sn">{records.length}</div><div className="sl">MoMs</div></div>
          <div className="sc" style={{borderLeft:"3px solid #00796b"}}><div className="sn" style={{color:"#00796b"}}>{trackers.length}</div><div className="sl">Trackers</div></div>
          <div className="sc purple"><div className="sn">{tasks.filter(t=>t.status!=="done").length}</div><div className="sl">Tasks actives</div></div>
          <div className="sc warn"><div className="sn">{pCount}</div><div className="sl">Pending</div></div>
          <div className="sc info"><div className="sn">{ipCount}</div><div className="sl">In Progress</div></div>
          <div className="sc warn"><div className="sn">{bCount}</div><div className="sl">Blocked</div></div>
          <div className="sc ok"><div className="sn">{dCount}</div><div className="sl">Done</div></div>

        <div className="filters" style={{marginBottom:13}}>
          <input className="si" placeholder="Rechercher…" value={fText} onChange={e=>setFText(e.target.value)}/>
          <select value={fDir} onChange={e=>setFDir(e.target.value)}><option value="all">All directions</option>{DIRECTIONS.map(d=><option key={d} value={d}>{DIR_LABELS[d]}</option>)}</select>

        </div>
        <div className="rlist">

            const tA=(r.packages||[]).reduce((s,p)=>s+p.actions.length,0);

            const pC=(r.packages||[]).reduce((s,p)=>s+p.actions.reduce((ss,a)=>ss+(a.photos||[]).length,0),0);

              <div className="pbar"><div className="pfill" style={{width:tA?`${Math.round(dA/tA*100)}%`:"0%"}}/></div>

              {t.package&&<span className="ppill">{t.package}</span>}

              {score>1&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:12,fontWeight:700,background:ss.bg,color:ss.color}}>{ss.label} <span style={{fontWeight:400,opacity:.7}}>I{t.importance||1}×U{t.urgence||1}</span></span>}
              {t.due&&<span style={{fontSize:11,color:"#bbb"}}>📅 {t.due}</span>}
              {t.createdAt&&<span style={{fontSize:11,color:"#ddd"}}>Added {t.createdAt}</span>}
              {(t.tags||[]).map(tg=>{const{bg,color}=tagColor(tg);return <span key={tg} style={{fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:700,background:bg,color}}>{tg}</span>;})}
              {getCCs(t.tags||[]).length>0&&<div style={{display:"flex",flexDirection:"column",gap:2,marginTop:2}}>{getCCs(t.tags||[]).map((p,ci)=><span key={p} style={{fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600,background:"#e8f5e9",color:"#2e7d32"}}>CC{ci+1} : {p.split(",")[0]}</span>)}</div>}
              {(t.photos||[]).length>0&&<span style={{fontSize:11,color:"#888"}}>📷 {(t.photos||[]).length}</span>}
            </div>
            {t.note&&<div style={{fontSize:12,color:"#888",marginTop:4,fontStyle:"italic",borderLeft:"2px solid #e8e6df",paddingLeft:7}}>{t.note}</div>}
            {(t.photos||[]).length>0&&<PhotoStrip photos={t.photos||[]} onView={setLightbox} small/>}
          </div>
          <button className="btn bgho" style={{flexShrink:0}} onClick={()=>setTaskForm({...t})}>✏️</button>
        </div>;})}
      </div>}

      {view==="actions"&&<div>
        <div className="stitle">Global View</div><div className="ssub">MoMs + tasks — cross filters.</div>
        <FilterPanel/>

          <span style={{fontWeight:700,color:filtA.length===0?"#c62828":"#1a1a1a"}}>{filtA.length}</span>
          <span>action{filtA.length!==1?"s":""} trouvée{filtA.length!==1?"s":""}</span>
          {afCount>0&&<span style={{color:"#bbb"}}>· {afCount} filtre{afCount>1?"s":""} actif{afCount>1?"s":""}</span>}

            {filtA.length>0&&<button className="btn" onClick={()=>setScoreEditMode(s=>!s)}

            </button>}

        </div>
        {filtA.length===0?<div className="empty"><div className="eico">🔍</div><div className="etxt">No matching actions.</div></div>
        :<div className="atwrap" style={{overflowX:"auto"}}><table className="attbl">
          <thead><tr><th>Action</th><th>Score</th><th>Tags</th><th>Package</th><th>Owner</th><th>CC</th><th>Due</th><th>Status</th><th>Source</th><th></th></tr></thead>
          <tbody>{filtA.map((ac,i)=>{
            const c=ownerColor(ac.owner||"");
            const isTask=ac.source==="task";
            const sc=calcScore(ac.importance||1,ac.urgence||1);
            const ss=scoreStyle(sc);
            const acCCs=[...new Set([...getCCs(ac.tags||[]),...getPkgCCs(ac.package||"")])].filter(p=>p!==ac.owner);
            const updateScore=(field,val)=>{
              if(isTask) saveT(tasks.map(t=>t.id===ac.id?{...t,[field]:val}:t));
              else if(ac.source==="tracker") updTrackerAF(ac.meetingId,ac.pkgId,ac.id,field,val);
              else updAF(ac.meetingId,ac.pkgId,ac.id,field,val);
            };
            return <tr key={ac.id||i}>
            <td style={{minWidth:220}}>{editingAction&&editingAction.id===ac.id
              ?<div style={{display:"flex",flexDirection:"column",gap:4}}>
                <textarea autoFocus value={editingAction.text} onChange={e=>setEditingAction(Object.assign({},editingAction,{text:e.target.value}))}

                <div style={{display:"flex",flexWrap:"wrap",gap:3}}>{tags.map(tg=>{const on=(editingAction.tags||[]).includes(tg);const tc=tagColor(tg);return <button key={tg} onClick={()=>{const t=editingAction.tags||[];setEditingAction(Object.assign({},editingAction,{tags:on?t.filter(x=>x!==tg):[...t,tg]}));}}
                  style={{padding:"2px 7px",borderRadius:12,border:"1.5px solid "+(on?tc.color:"#ddd"),background:on?tc.bg:"#fff",color:on?tc.color:"#bbb",fontFamily:"inherit",fontSize:10,fontWeight:700,cursor:"pointer"}}>{tg}</button>;})}</div>

                    var flds={text:ea.text,due:ea.due||"",tags:ea.tags||[],tenderRef:ea.tenderRef||""};
                    Object.keys(flds).forEach(function(f){
                      if(ea.source==="task")saveT(tasks.map(function(t){return t.id===ea.id?Object.assign({},t,{[f]:flds[f]}):t;}));
                      else if(ea.source==="tracker")updTrackerAF(ea.meetingId,ea.pkgId,ea.id,f,flds[f]);
                      else updAF(ea.meetingId,ea.pkgId,ea.id,f,flds[f]);

              <div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:9,fontWeight:800,color:"#aaa",width:10}}>U</span>{[1,2,3].map(v=><button key={v} onClick={()=>updateScore("urgence",v)} style={{width:20,height:20,borderRadius:3,border:"1.5px solid "+((ac.urgence||1)===v?"#1c1c1e":"#ddd"),background:(ac.urgence||1)===v?"#1c1c1e":"#fff",color:(ac.urgence||1)===v?"#fff":"#aaa",fontSize:10,fontWeight:800,cursor:"pointer",padding:0}}>{v}</button>)}</div>

            <td><div style={{display:"flex",flexWrap:"wrap",gap:3}}>{(ac.tags||[]).map(tg=>{const tc=tagColor(tg);return <span key={tg} style={{fontSize:10,padding:"2px 6px",borderRadius:12,fontWeight:700,background:tc.bg,color:tc.color,whiteSpace:"nowrap"}}>{tg}</span>;})}</div></td>
            <td>{ac.package?<span className="ppill">{ac.package}</span>:<span style={{color:"#ddd"}}>-</span>}</td>
            <td>{ac.owner?<span className="ochip" style={{background:c.bg,color:c.accent,fontSize:11,padding:"2px 7px",borderRadius:20,fontWeight:700,whiteSpace:"nowrap"}}>{ac.owner.split(",")[0]}</span>:<span style={{color:"#ddd"}}>-</span>}</td>
            <td><div style={{display:"flex",flexDirection:"column",gap:2}}>{acCCs.length>0?acCCs.map((p,ci)=><div key={p} style={{display:"flex",alignItems:"center",gap:3,whiteSpace:"nowrap"}}><span style={{fontSize:9,fontWeight:800,color:"#aaa",minWidth:22}}>CC{ci+1}</span><span style={{fontSize:10,padding:"1px 6px",borderRadius:20,fontWeight:600,background:"#e8f5e9",color:"#2e7d32",border:"1px solid #c8e6c9"}}>{p.split(",")[0]}</span></div>):<span style={{color:"#ddd",fontSize:12}}>-</span>}</div></td>
            <td style={{color:"#bbb",fontSize:11,whiteSpace:"nowrap"}}>{ac.due||"-"}</td>
            <td>{isTask?<select className="stsel" value={ac.status} onChange={e=>updTS(ac.id,e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
              :ac.source==="tracker"?<select className="stsel" value={ac.status} onChange={e=>updTrackerAF(ac.meetingId,ac.pkgId,ac.id,"status",e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
              :<select className="stsel" value={ac.status} onChange={e=>updAF(ac.meetingId,ac.pkgId,ac.id,"status",e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>}</td>

            <div className="dtit">{selTender.title}</div>
            <div className="dmeta"><span>📅 {selTender.createdAt}</span><span>📦 {(selTender.rows||[]).length} packages</span></div>
            {selTender.description&&<div style={{fontSize:13,color:"#888",fontStyle:"italic",marginTop:2}}>{selTender.description}</div>}
          </div>
        </div>
        <div style={{overflowX:"auto",background:"#fff",borderRadius:12,border:"1.5px solid #e8e6df"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}>
            <thead><tr style={{background:"#fafaf8"}}>
              <th style={{padding:"10px 14px",fontSize:11,fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:".5px",textAlign:"left",borderBottom:"1.5px solid #e8e6df"}}>Package</th>
              <th style={{padding:"10px 14px",fontSize:11,fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:".5px",textAlign:"left",borderBottom:"1.5px solid #e8e6df"}}>Owner</th>
              {TENDER_STEPS.filter(s=>!(selTender.hiddenSteps||[]).includes(s.key)).map(s=><th key={s.key} style={{padding:"10px 14px",fontSize:11,fontWeight:800,color:"#b45309",textTransform:"uppercase",letterSpacing:".5px",textAlign:"center",borderBottom:"1.5px solid #e8e6df",whiteSpace:"nowrap"}}>{s.label}</th>)}
            </tr></thead>
            <tbody>{(selTender.rows||[]).map((row,i)=>{
              const visSteps=TENDER_STEPS.filter(s=>!(selTender.hiddenSteps||[]).includes(s.key));
              return <tr key={row.id||i} style={{borderBottom:"1px solid #f5f4f0"}}>
                <td style={{padding:"10px 14px",fontSize:13,fontWeight:600}}>{row.name||<span style={{color:"#ccc"}}>—</span>}</td>
                <td style={{padding:"10px 14px",fontSize:12,color:"#666"}}>{row.resp||<span style={{color:"#ddd"}}>—</span>}</td>
                {visSteps.map(s=>{
                  const val=row[s.key]||"";
                  const cl=tenderStepColor(val);
                  return <td key={s.key} style={{padding:"8px 10px",textAlign:"center"}}>
                    <select value={val} onChange={e=>{
                      const sk=s.key;
                      const newRows=selTender.rows.map(function(r,ri){if(ri!==i)return r;var nr=Object.assign({},r);nr[sk]=e.target.value;return nr;});
                      const updated=Object.assign({},selTender,{rows:newRows});
                      saveD(tenders.map(t=>t.id===updated.id?updated:t));setSelTender(updated);
                    }} style={{padding:"4px 8px",borderRadius:20,border:"1.5px solid "+cl.color,background:cl.bg,color:cl.color,fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer",outline:"none",minWidth:110}}>
                      <option value="">—</option>
                      {s.opts.map(o=><option key={o} value={o}>{o}</option>)}
                    </select>
                  </td>;
                })}
              </tr>;
            })}</tbody>
          </table>
        </div>
        {(()=>{
          const linked=allA.filter(a=>(a.tenderRef||"")===selTender.title);
          if(!linked.length) return null;
          return <div style={{marginTop:16}}>
            <div style={{fontSize:12,fontWeight:800,color:"#b45309",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>📋 Linked Actions ({linked.length})</div>
            <div style={{background:"#fff",borderRadius:10,border:"1.5px solid #fed7aa",overflow:"hidden"}}>
              {linked.map((ac,i)=>{
                const sc=calcScore(ac.importance||1,ac.urgence||1);
                const ss=scoreStyle(sc);
                return <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 14px",borderBottom:i<linked.length-1?"1px solid #fff8f0":"none"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#1a1a1a"}}>{ac.text}</div>
                    {ac.details&&<div style={{fontSize:11,color:"#888",fontStyle:"italic",marginTop:2}}>{ac.details}</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4,alignItems:"center"}}>
                      {ac.owner&&<span style={{fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:20,background:ownerColor(ac.owner).bg,color:ownerColor(ac.owner).accent}}>{ac.owner.split(",")[0]}</span>}
                      {ac.due&&<span style={{fontSize:11,color:"#bbb"}}>📅 {ac.due}</span>}
                      {sc>1&&<span style={{fontSize:11,fontWeight:700,padding:"1px 6px",borderRadius:10,background:ss.bg,color:ss.color}}>{ss.label}</span>}
                      <span style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:"#f5f4f0",color:"#888"}}>{ac.source==="task"?"📌 Task":ac.source==="tracker"?"📊 "+ac.meetingTitle:"📋 "+ac.meetingTitle}</span>
                    </div>
                  </div>
                  <select className="stsel" value={ac.status} onChange={e=>{
                    if(ac.source==="task") saveT(tasks.map(t=>t.id===ac.id?Object.assign({},t,{status:e.target.value}):t));
                    else if(ac.source==="tracker") updTrackerAF(ac.meetingId,ac.pkgId,ac.id,"status",e.target.value);
                    else updAF(ac.meetingId,ac.pkgId,ac.id,"status",e.target.value);
                  }}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
                </div>;
              })}
            </div>
          </div>;
        })()}
      </div>}

      {/* ── Sticky bottom bar ── */}
      {view==="detail"&&selected&&!editMode&&<div className="sticky-bar">
        <span className="sb-title">📋 {selected.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>setEditMode(true)}>✏️ Edit</button>
        <button className="btn" style={{background:"#1c1c1e",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>{
          const acts=(selected.packages||[]).flatMap(pkg=>(pkg.actions||[]).map(ac=>({...ac,package:pkg.name,owner:pkg.owner,pkgId:pkg.id,meetingTitle:selected.title,meetingId:selected.id,direction:selected.direction,source:"mom"})));
          setEmailSource(acts);setShowEmailOut(true);
        }}>📋 Email</button>
        <button className="btn" style={{background:"#3949ab",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>{
          const today=new Date().toISOString().slice(0,10);
          const newTasks=(selected.packages||[]).flatMap(pkg=>
            (pkg.actions||[]).map(ac=>({
              id:uuid(),text:ac.text,owner:pkg.owner||"",package:pkg.name||"",
              status:ac.status||"pending",importance:ac.importance||1,urgence:ac.urgence||1,
              due:ac.due||"",note:"From MoM : "+selected.title+" ("+(selected.date||today)+")",
              photos:[],tags:ac.tags||[],completedAt:ac.completedAt||"",createdAt:today,
            }))
          );
          if(newTasks.length===0){alert("Ce MoM ne contient aucune action.");return;}
          if(!confirm("Create "+newTasks.length+" tâche"+(newTasks.length>1?"s":"")+" à partir de \""+selected.title+"\" ?\n\nThe MoM will remain intact."))return;
          saveT([...newTasks,...tasks]);setView("tasks");
        }}>📌 → Tasks ({(selected.packages||[]).reduce((s,p)=>s+(p.actions||[]).length,0)})</button>
        <button className="btn" style={{background:"#00796b",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>{
          const tr={id:uuid(),title:selected.title,description:selected.summary||"",createdAt:selected.date||new Date().toISOString().slice(0,10),packages:(selected.packages||[]).map(p=>({...p,id:uuid(),actions:(p.actions||[]).map(a=>({...a,id:uuid(),completedAt:a.status==="done"?a.completedAt||"":""}))}))}
          ;saveX([tr,...trackers]);setSelTracker(tr);setView("tracker-detail");
        }}>📊 → Tracker</button>
      </div>}

      {view==="detail"&&selected&&editMode&&<div className="sticky-bar">
        <span className="sb-title">✏️ {selected.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>setSelected({...selected,packages:[...(selected.packages||[]),newPkg()]})}>＋ Group</button>
        <div style={{flex:1}}/>
        <button className="btn" style={{background:"transparent",color:"#f87171",border:"1px solid #7f1d1d",fontSize:12}} onClick={()=>{if(confirm(`Supprimer "${selected.title}" ?`))delRec(selected.id);}}>🗑️ Delete</button>
        <button className="btn" style={{background:"transparent",color:"#ccc",border:"1px solid #555",fontSize:12}} onClick={()=>setEditMode(false)}>✕ Cancel</button>
        <button className="btn" style={{background:"#c9a84c",color:"#1c1c1e",fontWeight:700,fontSize:12}} onClick={()=>updRec(selected)}>💾 Save</button>
      </div>}

      {view==="new"&&<div className="sticky-bar">
        <span className="sb-title">➕ {form.title||"New MoM"}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={aP}>＋ Group</button>
        <button className="btn" style={{background:"transparent",color:"#ccc",border:"1px solid #555",fontSize:12}} onClick={()=>setView("dashboard")}>Cancel</button>
        <button className="btn" disabled={!form.title.trim()} style={{background:form.title.trim()?"#c9a84c":"#555",color:form.title.trim()?"#1c1c1e":"#999",fontWeight:700,fontSize:12}} onClick={addRec}>💾 Save</button>
      </div>}

      {view==="tracker-detail"&&selTracker&&<div className="sticky-bar">
        <span className="sb-title">📊 {selTracker.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>{
          const newG=newPkg();
          const updated={...selTracker,packages:[...(selTracker.packages||[]),newG]};
          saveX(trackers.map(t=>t.id===selTracker.id?updated:t));setSelTracker(updated);
        }}>＋ Group</button>
        <div style={{flex:1}}/>
        <button className="btn" style={{background:"#1c1c1e",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>{
          const acts=(selTracker.packages||[]).flatMap(pkg=>(pkg.actions||[]).map(ac=>({...ac,package:pkg.name,owner:pkg.owner,pkgId:pkg.id,meetingTitle:selTracker.title,meetingId:selTracker.id,source:"tracker"})));
          setEmailSource(acts);setShowEmailOut(true);
        }}>📋 Email</button>
        <button className="btn" style={{background:"transparent",color:"#f87171",border:"1px solid #7f1d1d",fontSize:12}} onClick={()=>{if(confirm("Supprimer \""+selTracker.title+"\" ?"))delTracker(selTracker.id);}}>🗑️ Delete</button>
        <button className="btn" style={{background:"#00796b",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>setTrackerForm({...selTracker})}>✏️ Edit</button>
      </div>}

      {view==="tender-detail"&&selTender&&<div className="sticky-bar">
        <span className="sb-title">📑 {selTender.title}</span>
        <div style={{flex:1}}/>
        <button className="btn" style={{background:"transparent",color:"#f87171",border:"1px solid #7f1d1d",fontSize:12}} onClick={()=>{if(confirm("Supprimer \""+selTender.title+"\" ?")){saveD(tenders.filter(x=>x.id!==selTender.id));setSelTender(null);setView("tenders");}}}>🗑️ Delete</button>
        <button className="btn" style={{background:"#b45309",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>setTenderForm({...selTender})}>✏️ Edit</button>
      </div>}

    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function() {
  function runApp() {
    try {
      var source = document.getElementById('app-source').textContent;
      var transformed = Babel.transform(source, {
        presets: ['react'],
        plugins: []
      }).code;
      eval(transformed);
    } catch(e) {
      document.body.innerHTML = '<div style="padding:20px;font-family:monospace;color:red;font-size:13px;white-space:pre-wrap">ERROR: ' + e.message + '\n\nLine: ' + (e.lineNumber||'?') + '</div>';
    }
  }
  
  function waitForBabel() {
    if (typeof Babel !== 'undefined' && typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
      // Also wait for Firebase
      if (window._dbReady || document.readyState === 'complete') {
        runApp();
      } else {
        window.addEventListener('db-ready', runApp, {once: true});
        // Fallback if Firebase never fires
        setTimeout(function() {
          if (document.getElementById('root') && !document.getElementById('root').firstChild) {
            runApp();
          }
        }, 3000);
      }
    } else {
      setTimeout(waitForBabel, 50);
    }
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitForBabel);
  } else {
    waitForBabel();
  }
})();
</script>
