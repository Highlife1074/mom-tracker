<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCs-tnK2RfDn9I1gDTZNwMs3hkyNghDbRo",
    authDomain: "rt-mom.firebaseapp.com",
    projectId: "rt-mom",
    storageBucket: "rt-mom.firebasestorage.app",
    messagingSenderId: "210967214795",
    appId: "1:210967214795:web:c4ccc7b00fb7039b57f94e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose db helpers globally for Babel/React code
  window._db = {
    get: async (key) => {
      try {
        const snap = await getDoc(doc(db, "mom_data", key));
        return snap.exists() ? snap.data().value : null;
      } catch(e) { console.error("FB get error", e); return null; }
    },
    set: async (key, value) => {
      try {
        await setDoc(doc(db, "mom_data", key), { value });
      } catch(e) { console.error("FB set error", e); }
    }
  };
  window._dbReady = true;
  window.dispatchEvent(new Event("db-ready"));
</script>

<style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ── Firebase storage (cloud) ──────────────────────────────────
const cloudStore = {
  get: async (key) => {
    if (!window._db) return null;
    const val = await window._db.get(key);
    if (val === null) return null;
    try { return typeof val === 'string' ? JSON.parse(val) : val; } catch { return val; }
  },
  set: async (key, value) => {
    if (!window._db) return;
    await window._db.set(key, JSON.stringify(value));
  }
};

const SK="records"; const LK="library"; const TK="tasks"; const PK="people"; const GK="tags"; const RK="tagrules"; const QK="pkgrules"; const XK="trackers";

const DIRECTIONS=["outgoing","incoming_boss","incoming_dept"];
const DIR_LABELS={outgoing:"📤 Sent to Team",incoming_boss:"📥 From Boss",incoming_dept:"🔄 From Department"};
const DIR_COLORS={outgoing:{bg:"#e8f5e9",accent:"#2e7d32",badge:"#c8e6c9"},incoming_boss:{bg:"#e3f2fd",accent:"#1565c0",badge:"#bbdefb"},incoming_dept:{bg:"#fff3e0",accent:"#e65100",badge:"#ffe0b2"}};
const STATUS_OPTIONS=["pending","in progress","done","blocked"];
const STATUS_ICONS={pending:"⏳","in progress":"🔄",done:"✅",blocked:"🚫"};
// ── Importance × Urgence → Score 1-9 ─────────────────────────
// importance: 1=low 2=medium 3=high  urgence: 1=low 2=medium 3=high
// score = importance × urgence (1–9)
function calcScore(imp,urg){return (imp||1)*(urg||1);}
function scoreStyle(s){
  if(s>=7) return {bg:"#ffeaea",color:"#c62828",label:`🔥 ${s}`,border:"#c62828"};
  if(s>=4) return {bg:"#fff8e1",color:"#f57f17",label:`⚡ ${s}`,border:"#f57f17"};
  return      {bg:"#f5f4f0",color:"#888",   label:`${s}`,border:"#ddd"};
}
const IMP_LABELS=["","Importance 1","Importance 2","Importance 3"];
const URG_LABELS=["","Urgence 1","Urgence 2","Urgence 3"];
const OWNER_COLORS=[{bg:"#e8eaf6",accent:"#3949ab"},{bg:"#fce4ec",accent:"#c2185b"},{bg:"#e0f2f1",accent:"#00796b"},{bg:"#fff3e0",accent:"#e65100"},{bg:"#f3e5f5",accent:"#7b1fa2"},{bg:"#e1f5fe",accent:"#0277bd"},{bg:"#f9fbe7",accent:"#827717"},{bg:"#fbe9e7",accent:"#bf360c"}];
function ownerColor(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%OWNER_COLORS.length;return OWNER_COLORS[h];}
function uuid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});}

const SEED_LIBRARY=["Acoustic Ceiling & Panels — Kvadras","AVRA Stone","Brickworks","Brushed Concrete","Concrete Blocks","Cover for Manholes","EPS","Exposed Aggregates","Fence","Fire Joint","Glazed Door","Granite","Grolla / Pool","Joinery LO","Manholes","Mirror Ceiling","MOCA","Open Channels","Paint","Plastering","Playground","Rainwater Channel & Other Channels","Repair Car Park","Resilient Flooring","SFS in Lobby","Special Paint","Stabilised Earth","Stone","Technical Wooden Floor","Threads","Trims","Waterproofing","Wood Flooring","Wooden Door","Wooden False Ceiling & Panels"].sort();
const SEED_PEOPLE=["BALLAS, Antonios","CHATZIROUMPIS, Vasilis","FYTOPOULOU, Katerina","KLEFTOSPYROU, Georgia","KOUTOULAKI, Anna","MAKROVASILI, Anastasia","NASIS, Athanasios","PLOUMISTOS, Georgios Paraskevas","ROSIOS, Irodion","ROUSSIN, Yanis","TSIAMPAOS, Konstantinos","VRETTOU, Eirini"].sort();
const SEED_TAGS=["Contract","Design","HR","Procurement","Production"].sort();
const TAG_COLORS=["#e8eaf6|#3949ab","#fce4ec|#c2185b","#e0f2f1|#00796b","#fff3e0|#e65100","#f3e5f5|#7b1fa2","#e8f5e9|#2e7d32","#fff8e1|#f57f17","#fbe9e7|#bf360c","#e3f2fd|#1565c0","#f9fbe7|#827717"];
function tagColor(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%TAG_COLORS.length;const parts=TAG_COLORS[h].split("|");return{bg:parts[0],color:parts[1]};}

const newTask=()=>({id:uuid(),text:"",owner:"",package:"",status:"pending",importance:1,urgence:1,due:"",note:"",photos:[],tags:[],createdAt:new Date().toISOString().slice(0,10)});
const newPkg=()=>({id:uuid(),name:"",owner:"",actions:[{id:uuid(),text:"",status:"pending",due:"",photos:[],tags:[],importance:1,urgence:1}]});
const defForm={title:"",date:new Date().toISOString().slice(0,10),direction:"outgoing",participants:"",summary:"",packages:[newPkg()]};

// ── ScorePicker — importance × urgence ──────────────────────────
function ScorePicker({imp,urg,onImp,onUrg}){
  const score=calcScore(imp,urg);
  const ss=scoreStyle(score);
  const btn=(val,cur,setter,label)=><button onClick={()=>setter(val)}
    style={{width:22,height:22,borderRadius:4,border:`1.5px solid ${cur===val?"#1c1c1e":"#ddd"}`,background:cur===val?"#1c1c1e":"#fff",color:cur===val?"#fff":"#aaa",fontFamily:"inherit",fontSize:10,fontWeight:800,cursor:"pointer",transition:"all .1s",display:"flex",alignItems:"center",justifyContent:"center"}}>
    {val}
  </button>;
  return <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
    <div style={{display:"flex",alignItems:"center",gap:3}}>
      <span style={{fontSize:10,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:".4px",marginRight:2}}>I</span>
      {[1,2,3].map(v=>btn(v,imp,onImp))}
    </div>
    <span style={{color:"#ccc",fontSize:11}}>×</span>
    <div style={{display:"flex",alignItems:"center",gap:3}}>
      <span style={{fontSize:10,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:".4px",marginRight:2}}>U</span>
      {[1,2,3].map(v=>btn(v,urg,onUrg))}
    </div>
    <span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:12,background:ss.bg,color:ss.color,minWidth:36,textAlign:"center"}}>{ss.label}</span>
  </div>;
}

// ── PkgForm — top-level to prevent focus loss on re-render ───────
function PkgForm({pkg,pi,sPkg,sAct,aAct,rAct,rPkg,library,people,addLib,addPpl,tags=[]}){
  return <div className="fpkg">
    <div className="fpkghdr">
      <div className="fg" style={{flex:2}}><label>Package</label><PkgPicker value={pkg.name} onChange={v=>sPkg(pi,"name",v)} library={library} addLib={addLib}/></div>
      <div className="fg" style={{flex:1}}><label>Responsable</label><PersonPicker value={pkg.owner} onChange={v=>sPkg(pi,"owner",v)} people={people} addPeople={addPpl}/></div>
      <button className="btn bgho" onClick={()=>rPkg(pi)} style={{alignSelf:"flex-end",padding:"8px"}}>✕</button>
    </div>
    {pkg.actions.map((ac,ai)=><div key={ac.id||ai} style={{marginBottom:6}}>
      <div className="farow" style={{marginBottom:3}}>
        <input type="text" placeholder="Action…" value={ac.text} onChange={e=>sAct(pi,ai,"text",e.target.value)}/>
        <input type="date" value={ac.due} onChange={e=>sAct(pi,ai,"due",e.target.value)}/>
        <select value={ac.status} onChange={e=>sAct(pi,ai,"status",e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
        <button className="btn bgho" onClick={()=>rAct(pi,ai)}>✕</button>
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",paddingLeft:2,marginBottom:2}}>
        <ScorePicker imp={ac.importance||1} urg={ac.urgence||1} onImp={v=>sAct(pi,ai,"importance",v)} onUrg={v=>sAct(pi,ai,"urgence",v)}/>
      </div>
      {tags.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,paddingLeft:2,paddingBottom:4,alignItems:"center",marginTop:4}}>
        <span style={{fontSize:10,fontWeight:700,color:"#bbb",textTransform:"uppercase",letterSpacing:".4px",marginRight:2,flexShrink:0}}>Tags</span>
        {tags.map(t=>{
          const on=(ac.tags||[]).includes(t);
          const tc=tagColor(t);
          return <button key={t} onClick={()=>sAct(pi,ai,"tags",on?(ac.tags||[]).filter(x=>x!==t):[...(ac.tags||[]),t])}
            style={{padding:"3px 10px",borderRadius:20,border:`1.5px solid ${on?tc.color:"#ddd"}`,background:on?tc.bg:"#fff",color:on?tc.color:"#bbb",fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer",transition:"all .12s"}}>
            {t}
          </button>;
        })}
      </div>}
    </div>)}
    <button className="btn bgho" style={{fontSize:12,color:"#777",marginTop:3}} onClick={()=>aAct(pi)}>＋ Action</button>
  </div>;
}

function PhotoStrip({photos=[],onAdd,onRemove,onView,small}){
  const ref=useRef();const sz=small?44:56;
  const handle=async files=>{for(const f of Array.from(files)){if(!f.type.startsWith("image/"))continue;if(f.size>4*1024*1024){alert(`"${f.name}" dépasse 4 MB.`);continue;}const d=await readFile(f);onAdd({id:uuid(),name:f.name,data:d,addedAt:new Date().toISOString().slice(0,10)});}};
  return <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",marginTop:small?4:6}}>
    {photos.map(ph=><div key={ph.id} style={{position:"relative",cursor:"pointer"}} onClick={()=>onView(ph)}>
      <img src={ph.data} alt={ph.name} style={{width:sz,height:sz,objectFit:"cover",borderRadius:6,border:"1.5px solid #e8e6df",display:"block"}}/>

function DropPicker({value,onChange,items,onAddNew,placeholder,renderItem}){
  const [open,setOpen]=useState(false);const [q,setQ]=useState("");const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);

    <div style={{position:"relative"}}>
      <input type="text" placeholder={placeholder} value={open?q:value}
        onFocus={()=>{setOpen(true);setQ("");}} onChange={e=>{setQ(e.target.value);if(!open)setOpen(true);}}
        style={{width:"100%",padding:"8px 32px 8px 12px",border:`1.5px solid ${open?"#1c1c1e":"#ddd"}`,borderRadius:8,fontFamily:"inherit",fontSize:13,outline:"none",background:"#fff"}}/>
      <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#bbb",pointerEvents:"none",fontSize:11}}>▾</span>
    </div>
    {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1.5px solid #1c1c1e",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,.12)",zIndex:999,maxHeight:240,overflow:"hidden",display:"flex",flexDirection:"column"}}>
      <div style={{overflowY:"auto",flex:1}}>
        {filtered.map(p=><div key={p} onClick={()=>{onChange(p);setQ("");setOpen(false);}}
          style={{padding:"8px 13px",fontSize:13,cursor:"pointer",borderBottom:"1px solid #f5f4f0",display:"flex",alignItems:"center",gap:8}}
          onMouseEnter={e=>e.currentTarget.style.background="#f5f4f0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
          {renderItem?renderItem(p):<span style={{flex:1}}>{p}</span>}
          {value===p&&<span style={{color:"#2e7d32",fontSize:12}}>✓</span>}
        </div>)}
        {filtered.length===0&&!showAdd&&<div style={{padding:"14px",fontSize:13,color:"#bbb",textAlign:"center"}}>Aucun résultat</div>}
      </div>

        <div style={{fontSize:12,color:"#888",marginBottom:6}}><strong>"{q.trim()}"</strong> n'est pas dans la liste.</div>
        <button onClick={()=>{onAddNew(q.trim());onChange(q.trim());setQ("");setOpen(false);}} style={{width:"100%",padding:"7px 12px",background:"#1c1c1e",color:"#fff",border:"none",borderRadius:7,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>＋ Ajouter à la liste et sélectionner</button>
      </div>}
    </div>}
  </div>;
}

  // ── Backup Modal ─────────────────────────────────────────────
  function BakModal(){
    const [err,setErr]=useState("");const [ok,setOk]=useState(false);const fRef=useRef();
    const exp=()=>{const b=new Blob([JSON.stringify({version:6,exportedAt:new Date().toISOString(),records,tasks,trackers,library,people,tags,rules,pkgRules},null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`mom-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);};
    const imp=async text=>{setErr("");setOk(false);try{const d=JSON.parse(text);if(!d.records||!Array.isArray(d.records))throw new Error("Format invalide.");if(d.records)saveR(d.records);if(d.tasks)saveT(d.tasks);if(d.trackers)saveX(d.trackers);if(d.library)saveL(d.library);if(d.people)saveP(d.people);if(d.tags)saveG(d.tags);if(d.rules)saveRules(d.rules);if(d.pkgRules)savePkgRules(d.pkgRules);setOk(true);setTimeout(()=>setShowBak(false),1400);}catch(e){setErr("Erreur : "+e.message);}};
    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)setShowBak(false)}}>

          <button onClick={()=>setShowBak(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#bbb"}}>×</button>

          <div style={{background:"#f5f4f0",borderRadius:10,padding:"15px 17px"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>📤 Exporter une copie locale</div>
            <div style={{fontSize:12,color:"#555",marginBottom:10,display:"flex",gap:12,flexWrap:"wrap"}}><span>📋 {records.length} MoM{records.length>1?"s":""}</span><span>📌 {tasks.length} tâche{tasks.length>1?"s":""}</span><span>📦 {library.length} packages</span><span>👥 {people.length} personnes</span></div>
            <button className="btn bpri" style={{width:"100%",justifyContent:"center"}} onClick={exp}>⬇️ Télécharger la sauvegarde</button>
          </div>
          <div style={{background:"#f5f4f0",borderRadius:10,padding:"15px 17px"}}>

            <input ref={fRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{if(e.target.files[0]){const r=new FileReader();r.onload=ev=>imp(ev.target.result);r.readAsText(e.target.files[0]);}}}/>
            <button className="btn bout" style={{width:"100%",justifyContent:"center"}} onClick={()=>fRef.current.click()}>📂 Choisir un fichier JSON</button>

  // ── Email Output Modal ────────────────────────────────────────
  function EmailOutModal(){
    const [copied,setCopied]=useState(false);

    // Build email text from current filtA
    const buildEmail=()=>{
      const today=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
      // Group by source meeting / task
      const bySource={};
      filtA.forEach(ac=>{
        const key=ac.source==="task"?"📌 Tâches standalone":ac.source==="tracker"?`📊 ${ac.meetingTitle}`:ac.meetingTitle;
        if(!bySource[key]) bySource[key]=[];
        bySource[key].push(ac);
      });

      // Subject line
      const filterDesc=[];
      if(fOwner!=="all") filterDesc.push(fOwner);
      if(fPkg!=="all") filterDesc.push(fPkg);
      if(fTag!=="all") filterDesc.push(`[${fTag}]`);
      if(fStatus!=="all") filterDesc.push(fStatus);
      const subject=filterDesc.length>0
        ?`Suivi actions — ${filterDesc.join(" · ")} — ${today}`
        :`Suivi actions — ${today}`;

      let body=`Bonjour,\n\nVeuillez trouver ci-dessous le récapitulatif des actions${filterDesc.length>0?" ("+filterDesc.join(", ")+")":""} au ${today}.\n\n`;
      body+=`${"─".repeat(60)}\n\n`;

      Object.entries(bySource).forEach(([src,actions])=>{
        body+=`${src}\n${"─".repeat(src.length)}\n\n`;
        // Group by package within each source
        const byPkg={};
        actions.forEach(ac=>{
          const k=ac.package||"—";
          if(!byPkg[k]) byPkg[k]=[];
          byPkg[k].push(ac);
        });
        Object.entries(byPkg).forEach(([pkg,acts])=>{
          if(pkg!=="—") body+=`  📦 ${pkg}\n`;
          acts.forEach(ac=>{
            const status={"pending":"⏳","in progress":"🔄","done":"✅","blocked":"🚫"}[ac.status]||"•";
            const owner=ac.owner?` @${ac.owner.split(",")[0]}`:"";
            const due=ac.due?` → échéance ${new Date(ac.due).toLocaleDateString("fr-FR")}`:"";
            const tags=(ac.tags||[]).length>0?` [${ac.tags.join(", ")}]`:"";
            const sc=calcScore(ac.importance||1,ac.urgence||1);
            const scoreStr=sc>1?` {Score ${sc} — I${ac.importance||1}×U${ac.urgence||1}}`:"";
            const ccs=[...getCCs(ac.tags||[]),...getPkgCCs(ac.package||"")].filter((v,i,a)=>a.indexOf(v)===i);
            const ccStr=ccs.length>0?" ("+ccs.map((p,ci)=>`CC${ci+1}: ${p.split(",")[0]}`).join(", ")+")" :"";
            body+=`    ${status} ${ac.text}${owner}${due}${scoreStr}${tags}${ccStr}\n`;
          });
          body+="\n";
        });
      });

      body+=`${"─".repeat(60)}\n`;
      body+=`Total : ${filtA.length} action${filtA.length>1?"s":""} · Généré le ${today}\n`;
      return {subject,body};
    };

    const {subject,body}=buildEmail();
    const full=`Objet : ${subject}\n\n${body}`;

    const copy=()=>{
      navigator.clipboard.writeText(full).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
    };

    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)setShowEmailOut(false)}}>
      <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:680,maxHeight:"88vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}>
        <div style={{padding:"18px 22px 14px",borderBottom:"1.5px solid #e8e6df",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18}}>📋 Email de suivi</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:3}}>{filtA.length} action{filtA.length>1?"s":""} · basé sur les filtres actifs</div>
          </div>
          <button onClick={()=>setShowEmailOut(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#bbb",flexShrink:0}}>×</button>
        </div>
        <div style={{padding:"14px 22px 8px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:".5px",marginBottom:4}}>Objet</div>
          <div style={{padding:"8px 12px",background:"#f5f4f0",borderRadius:8,fontSize:13,fontWeight:600,color:"#1a1a1a"}}>{subject}</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 22px 14px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:".5px",marginBottom:4}}>Corps du message</div>
          <textarea readOnly value={body}
            style={{width:"100%",height:"100%",minHeight:320,padding:"12px 14px",border:"1.5px solid #e8e6df",borderRadius:10,fontFamily:"'Courier New',monospace",fontSize:12,lineHeight:1.7,resize:"none",background:"#fafaf8",color:"#1a1a1a",outline:"none"}}/>
        </div>
        <div style={{padding:"12px 22px 18px",borderTop:"1.5px solid #e8e6df",display:"flex",gap:8,justifyContent:"flex-end",alignItems:"center"}}>
          <span style={{fontSize:12,color:"#aaa",flex:1}}>Collez directement dans Outlook, Gmail, Teams…</span>
          <button className="btn bout" onClick={()=>setShowEmailOut(false)}>Fermer</button>
          <button className="btn bpri" onClick={copy} style={{minWidth:160,justifyContent:"center",background:copied?"#2e7d32":"#1c1c1e"}}>
            {copied?"✅ Copié !":"📋 Copier tout"}
          </button>
        </div>
      </div>
    </div>;
  }

      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>

            const acCCs=[...new Set([...getCCs(ac.tags||[]),...getPkgCCs(ac.package||"")])].filter(p=>p!==ac.owner);

              if(isTask) saveT(tasks.map(t=>t.id===ac.id?{...t,[field]:val}:t));
              else if(ac.source==="tracker") updTrackerAF(ac.meetingId,ac.pkgId,ac.id,field,val);
              else updAF(ac.meetingId,ac.pkgId,ac.id,field,val);
            };

              <div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:9,fontWeight:800,color:"#aaa",width:10}}>I</span>{[1,2,3].map(v=><button key={v} onClick={()=>updateScore("importance",v)} style={{width:20,height:20,borderRadius:3,border:"1.5px solid "+((ac.importance||1)===v?"#1c1c1e":"#ddd"),background:(ac.importance||1)===v?"#1c1c1e":"#fff",color:(ac.importance||1)===v?"#fff":"#aaa",fontSize:10,fontWeight:800,cursor:"pointer",padding:0}}>{v}</button>)}</div>
              <div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:9,fontWeight:800,color:"#aaa",width:10}}>U</span>{[1,2,3].map(v=><button key={v} onClick={()=>updateScore("urgence",v)} style={{width:20,height:20,borderRadius:3,border:"1.5px solid "+((ac.urgence||1)===v?"#1c1c1e":"#ddd"),background:(ac.urgence||1)===v?"#1c1c1e":"#fff",color:(ac.urgence||1)===v?"#fff":"#aaa",fontSize:10,fontWeight:800,cursor:"pointer",padding:0}}>{v}</button>)}</div>
              <span style={{fontSize:11,fontWeight:800,padding:"1px 6px",borderRadius:8,background:ss.bg,color:ss.color,textAlign:"center"}}>{ss.label}</span>
            </div>:<div><span style={{fontSize:11,fontWeight:800,padding:"2px 7px",borderRadius:10,background:ss.bg,color:ss.color,whiteSpace:"nowrap"}}>{ss.label}</span>{sc>1&&<div style={{fontSize:10,color:"#bbb",marginTop:1}}>I{ac.importance||1}x U{ac.urgence||1}</div>}</div>}</td>
            <td><div style={{display:"flex",flexWrap:"wrap",gap:3}}>{(ac.tags||[]).map(tg=>{const tc=tagColor(tg);return <span key={tg} style={{fontSize:10,padding:"2px 6px",borderRadius:12,fontWeight:700,background:tc.bg,color:tc.color,whiteSpace:"nowrap"}}>{tg}</span>;})}</div></td>

            <td>{ac.owner?<span className="ochip" style={{background:c.bg,color:c.accent,fontSize:11,padding:"2px 7px",borderRadius:20,fontWeight:700,whiteSpace:"nowrap"}}>{ac.owner.split(",")[0]}</span>:<span style={{color:"#ddd"}}>-</span>}</td>

            <td>{isTask?<select className="stsel" value={ac.status} onChange={e=>updTS(ac.id,e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>

            <td>{isTask?<button className="btn bgho" style={{color:"#6a1b9a",fontSize:11,whiteSpace:"nowrap"}} onClick={()=>setTaskForm({...ac})}>Tache</button>

            <td><button className="btn bgho" style={{color:"#ddd",fontSize:13,padding:"3px 6px"}} onMouseEnter={e=>e.currentTarget.style.color="#c62828"} onMouseLeave={e=>e.currentTarget.style.color="#ddd"}
              onClick={()=>{if(!confirm("Supprimer cette action ?"))return;
                if(isTask) delTsk(ac.id);
                else if(ac.source==="tracker") delTrackerAction(ac.meetingId,ac.pkgId,ac.id);
                else delMoMAction(ac.meetingId,ac.pkgId,ac.id);
              }}>x</button></td>
          </tr>;})}
          </tbody>
        </table></div>}
      </div>}

      {view==="new"&&<div>

            <div className="fg full"><label>Résumé</label><textarea placeholder="Points clés…" value={form.summary} onChange={e=>setForm({...form,summary:e.target.value})}/></div>
          </div>
          <div style={{marginTop:18}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}><label style={{fontSize:12}}>Packages & Actions</label><button className="btn bout" style={{fontSize:12,padding:"5px 10px"}} onClick={aP}>＋ Package</button></div>
            {form.packages.map((pkg,pi)=><PkgForm key={pkg.id} pkg={pkg} pi={pi} sPkg={sP} sAct={sA} aAct={aA} rAct={rA} rPkg={rP} library={library} people={people} addLib={addLib} addPpl={addPpl} tags={tags}/>)}

          <div className="fbtns"><button className="btn bout" onClick={()=>setView("dashboard")}>Annuler</button><button className="btn bpri" disabled={!form.title.trim()} onClick={addRec}>Enregistrer</button></div>
        </div>
      </div>}

      {view==="detail"&&selected&&<div>
        <button className="bbtn" onClick={()=>setView("dashboard")}>← Retour</button>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4}}>
          <div>
            <span className="badge" style={{background:(DIR_COLORS[selected.direction]||DIR_COLORS.outgoing).badge,color:(DIR_COLORS[selected.direction]||DIR_COLORS.outgoing).accent,marginBottom:7,display:"inline-flex"}}>{DIR_LABELS[selected.direction]||selected.direction}</span>
            <div className="dtit">{selected.title}</div>

          </div>
          <div style={{display:"flex",gap:7,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button className="btn bout" onClick={()=>setEditMode(!editMode)}>{editMode?"Annuler":"✏️ Modifier"}</button>

                    {ac.due&&<div className="adue">📅 {ac.due}</div>}
                    {(ac.tags||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}>{(ac.tags||[]).map(tg=>{const{bg,color}=tagColor(tg);return <span key={tg} style={{fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:700,background:bg,color}}>{tg}</span>;})}</div>}
                    {(()=>{const ccs=[...new Set([...getCCs(ac.tags||[]),...getPkgCCs(ac.package||"")])].filter(p=>p!==ac.owner);return ccs.length>0&&<div style={{display:"flex",flexDirection:"column",gap:2,marginTop:3}}>{ccs.map((p,ci)=><span key={p} style={{fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600,background:"#e8f5e9",color:"#2e7d32",display:"inline-flex",alignItems:"center",gap:4}}><span style={{fontSize:9,fontWeight:800,color:"#aaa"}}>CC{ci+1}</span>{p.split(",")[0]}</span>)}</div>;})()}
                    {ac.status==="done"&&ac.completedAt&&<div style={{fontSize:11,color:"#2e7d32",fontWeight:600,marginTop:3}}>✅ Réalisé le {ac.completedAt}</div>}
                    <PhotoStrip photos={ac.photos||[]} onAdd={ph=>addAPhoto(selected.id,pkg.id,ac.id,ph)} onRemove={phId=>remAPhoto(selected.id,pkg.id,ac.id,phId)} onView={setLightbox} small/>
                  </td>
                  <td style={{verticalAlign:"top",paddingTop:12}}>
                    <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end"}}>
                      <select className="stsel" value={ac.status} onChange={e=>updAF(selected.id,pkg.id,ac.id,"status",e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
                      {ac.status==="done"&&<div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}>
                        <span style={{fontSize:10,color:"#aaa",whiteSpace:"nowrap"}}>Réalisé le</span>
                        <input type="date" value={ac.completedAt||""} onChange={e=>updAF(selected.id,pkg.id,ac.id,"completedAt",e.target.value)} style={{padding:"2px 5px",border:"1px solid #ddd",borderRadius:5,fontSize:11,fontFamily:"inherit",outline:"none",width:115}}/>
                      </div>}
                      {(()=>{const sc=calcScore(ac.importance||1,ac.urgence||1);const ss=scoreStyle(sc);return sc>1&&<span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:12,background:ss.bg,color:ss.color,whiteSpace:"nowrap"}}>{ss.label}</span>;})()}
                      <div style={{display:"flex",gap:3}}>
                        <div style={{display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                          <span style={{fontSize:9,color:"#bbb",fontWeight:700}}>I</span>
                          {[1,2,3].map(v=><button key={v} onClick={()=>updAF(selected.id,pkg.id,ac.id,"importance",v)} style={{width:18,height:18,borderRadius:3,border:`1px solid ${(ac.importance||1)===v?"#1c1c1e":"#ddd"}`,background:(ac.importance||1)===v?"#1c1c1e":"#fff",color:(ac.importance||1)===v?"#fff":"#aaa",fontSize:9,fontWeight:800,cursor:"pointer",padding:0}}>{v}</button>)}
                        </div>
                        <span style={{fontSize:11,color:"#ddd",alignSelf:"center"}}>×</span>
                        <div style={{display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                          <span style={{fontSize:9,color:"#bbb",fontWeight:700}}>U</span>
                          {[1,2,3].map(v=><button key={v} onClick={()=>updAF(selected.id,pkg.id,ac.id,"urgence",v)} style={{width:18,height:18,borderRadius:3,border:`1px solid ${(ac.urgence||1)===v?"#1c1c1e":"#ddd"}`,background:(ac.urgence||1)===v?"#1c1c1e":"#fff",color:(ac.urgence||1)===v?"#fff":"#aaa",fontSize:9,fontWeight:800,cursor:"pointer",padding:0}}>{v}</button>)}
                        </div>
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:3,justifyContent:"flex-end",maxWidth:160}}>{tags.map(tg=>{const{bg,color}=tagColor(tg);const on=(ac.tags||[]).includes(tg);return <button key={tg} onClick={()=>updAF(selected.id,pkg.id,ac.id,"tags",on?(ac.tags||[]).filter(x=>x!==tg):[...(ac.tags||[]),tg])} style={{padding:"2px 7px",borderRadius:12,border:`1.5px solid ${on?color:"#e0ddd6"}`,background:on?bg:"#fff",color:on?color:"#ccc",fontFamily:"inherit",fontSize:10,fontWeight:700,cursor:"pointer"}}>{tg}</button>;})}</div>
                    </div>
                  </td>
                </tr>)}
              </tbody></table>
            </div>;
          })}
        </div>:<div className="fcard" style={{marginTop:13}}>
          <div className="fgrid">
            <div className="fg full"><label>Titre</label><input type="text" value={selected.title} onChange={e=>ssS("title",e.target.value)}/></div>
            <div className="fg"><label>Date</label><input type="date" value={selected.date} onChange={e=>ssS("date",e.target.value)}/></div>
            <div className="fg"><label>Participants</label><input type="text" value={selected.participants} onChange={e=>ssS("participants",e.target.value)}/></div>
            <div className="fg full"><label>Direction</label><div className="dirsel">{DIRECTIONS.map(d=><div key={d} className={`dirop${selected.direction===d?" on":""}`} onClick={()=>ssS("direction",d)}>{DIR_LABELS[d]}</div>)}</div></div>
            <div className="fg full"><label>Résumé</label><textarea value={selected.summary} onChange={e=>ssS("summary",e.target.value)}/></div>
          </div>
          <div style={{marginTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}><label style={{fontSize:12}}>Packages</label><button className="btn bout" style={{fontSize:12,padding:"5px 10px"}} onClick={ssAP}>＋ Package</button></div>
            {(selected.packages||[]).map((pkg,pi)=><PkgForm key={pkg.id} pkg={pkg} pi={pi} sPkg={ssP} sAct={ssSA} aAct={()=>ssAA(pi)} rAct={ssRA} rPkg={ssRP} library={library} people={people} addLib={addLib} addPpl={addPpl} tags={tags}/>)}
          </div>
          <div className="fbtns"><button className="btn bout" onClick={()=>setEditMode(false)}>Annuler</button><button className="btn bpri" onClick={()=>updRec(selected)}>Sauvegarder</button></div>
        </div>}
      </div>}

      {/* TRACKERS LIST */}
      {view==="trackers"&&<div>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,marginBottom:2}}>
          <div><div className="stitle">Trackers</div><div className="ssub">Suivis de sous-projets et thèmes récurrents.</div></div>
          <button className="btn" style={{background:"#00796b",color:"#fff",flexShrink:0}} onClick={()=>setTrackerForm(newTrackerForm())}>＋ Nouveau tracker</button>
        </div>
        {trackers.length===0?<div className="empty"><div className="eico">📊</div><div className="etxt">Aucun tracker. Créez-en un pour suivre un sous-projet.</div></div>
        :<div className="rlist">{trackers.map(tr=>{
          const allActs=(tr.packages||[]).flatMap(p=>p.actions||[]);
          const done=allActs.filter(a=>a.status==="done").length;
          const total=allActs.length;
          const pct=total?Math.round(done/total*100):0;
          const owners=[...new Set((tr.packages||[]).map(p=>p.owner))].filter(Boolean);
          return <div className="rcard" key={tr.id} onClick={()=>{setSelTracker(tr);setView("tracker-detail");}}>
            <div className="rhdr">
              <div className="rtit">{tr.title}</div>
              <span className="badge" style={{background:"#e0f2f1",color:"#00796b"}}>📊 Tracker</span>
            </div>
            <div className="rmeta"><span>📅 Créé le {tr.createdAt}</span><span>📦 {(tr.packages||[]).length} groupe{(tr.packages||[]).length>1?"s":""}</span><span>🔖 {done}/{total} done</span></div>
            <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:"#00796b"}}/></div>
            {tr.description&&<div style={{fontSize:12,color:"#888",marginBottom:6,fontStyle:"italic"}}>{tr.description}</div>}
            <div className="ppills">{(tr.packages||[]).slice(0,8).map(p=><span className="ppill" key={p.id}>{p.name}</span>)}{(tr.packages||[]).length>8&&<span className="ppill">+{(tr.packages||[]).length-8}</span>}</div>
            <div className="ostrip">{owners.map(o=>{const c=ownerColor(o);return <span key={o} className="ochip" style={{background:c.bg,color:c.accent}}>{o}</span>;})}</div>
          </div>;
        })}</div>}
      </div>}

      {/* TRACKER DETAIL */}
      {view==="tracker-detail"&&selTracker&&<div>
        <button className="bbtn" onClick={()=>setView("trackers")}>← Retour</button>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4}}>
          <div>
            <span className="badge" style={{background:"#e0f2f1",color:"#00796b",marginBottom:7,display:"inline-flex"}}>📊 Tracker</span>
            <div className="dtit">{selTracker.title}</div>
            <div className="dmeta"><span>📅 Créé le {selTracker.createdAt}</span><span>📦 {(selTracker.packages||[]).length} groupe{(selTracker.packages||[]).length>1?"s":""}</span></div>
            {selTracker.description&&<div style={{fontSize:13,color:"#888",fontStyle:"italic",marginTop:2}}>{selTracker.description}</div>}
          </div>
          <div style={{display:"flex",gap:7,flexShrink:0}}>
            <button className="btn bout" onClick={()=>setTrackerForm({...selTracker})}>✏️ Modifier</button>
            <button className="btn bdgr" onClick={()=>{if(confirm(`Supprimer "${selTracker.title}" ?`))delTracker(selTracker.id);}}>🗑️</button>
          </div>
        </div>
        {(selTracker.packages||[]).map(pkg=>{
          const c=ownerColor(pkg.owner||"");
          const done=pkg.actions.filter(a=>a.status==="done").length;
          return <div className="pkgblock" key={pkg.id}>
            <div className="pkghdr">
              <div className="pkgname"><span>📁 {pkg.name}</span>{pkg.owner&&<span style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,background:c.bg,color:c.accent}}>{pkg.owner}</span>}</div>
              <span style={{fontSize:12,color:"#bbb"}}>{done}/{pkg.actions.length}</span>
            </div>
            <div className="pbar"><div className="pfill" style={{width:pkg.actions.length?`${Math.round(done/pkg.actions.length*100)}%`:"0%",background:"#00796b"}}/></div>
            <table className="pkgtbl"><tbody>
              {pkg.actions.map(ac=>{
                const sc=calcScore(ac.importance||1,ac.urgence||1);
                const ss=scoreStyle(sc);
                return <tr key={ac.id}>
                  <td>
                    <div className="atext" style={{textDecoration:ac.status==="done"?"line-through":"none",color:ac.status==="done"?"#bbb":"#1a1a1a"}}>{ac.text}</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:3,alignItems:"center"}}>
                      {ac.due&&<span style={{fontSize:11,color:"#bbb"}}>📅 {ac.due}</span>}
                      {ac.status==="done"&&ac.completedAt&&<span style={{fontSize:11,color:"#2e7d32",fontWeight:600}}>✅ Réalisé le {ac.completedAt}</span>}
                      {sc>1&&<span style={{fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:10,background:ss.bg,color:ss.color}}>{ss.label}</span>}
                      {(ac.tags||[]).map(tg=>{const{bg,color}=tagColor(tg);return <span key={tg} style={{fontSize:11,padding:"2px 7px",borderRadius:12,fontWeight:700,background:bg,color}}>{tg}</span>;})}
                    </div>
                  </td>
                  <td style={{verticalAlign:"top",paddingTop:10}}>
                    <div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
                      <select className="stsel" value={ac.status} onChange={e=>updTrackerAF(selTracker.id,pkg.id,ac.id,"status",e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s} value={s}>{STATUS_ICONS[s]} {s}</option>)}</select>
                      {ac.status==="done"&&<div style={{display:"flex",alignItems:"center",gap:4}}>
                        <span style={{fontSize:10,color:"#aaa"}}>Réalisé le</span>
                        <input type="date" value={ac.completedAt||""} onChange={e=>updTrackerAF(selTracker.id,pkg.id,ac.id,"completedAt",e.target.value)} style={{padding:"2px 5px",border:"1px solid #ddd",borderRadius:5,fontSize:11,fontFamily:"inherit",outline:"none",width:120}}/>
                      </div>}
                    </div>
                  </td>
                </tr>;
              })}
            </tbody></table>
          </div>;
        })}
      </div>}

      {/* ── Sticky bottom bar ── */}
      {view==="detail"&&selected&&!editMode&&<div className="sticky-bar">
        <span className="sb-title">📋 {selected.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>setEditMode(true)}>✏️ Modifier</button>
        <button className="btn" style={{background:"#3949ab",color:"#fff",fontWeight:700,fontSize:12}} title="Convertir toutes les actions en tâches standalone" onClick={()=>{
          const today=new Date().toISOString().slice(0,10);
          const newTasks=(selected.packages||[]).flatMap(pkg=>
            (pkg.actions||[]).map(ac=>({
              id:uuid(),
              text:ac.text,
              owner:pkg.owner||"",
              package:pkg.name||"",
              status:ac.status||"pending",
              importance:ac.importance||1,
              urgence:ac.urgence||1,
              due:ac.due||"",
              note:`Issu du MoM : ${selected.title} (${selected.date||today})`,
              photos:[],
              tags:ac.tags||[],
              completedAt:ac.completedAt||"",
              createdAt:today,
            }))
          );
          if(newTasks.length===0){alert("Ce MoM ne contient aucune action.");return;}
          if(!confirm(`Créer ${newTasks.length} tâche${newTasks.length>1?"s":""} à partir de "${selected.title}" ?\n\nLe MoM restera intact.`))return;
          saveT([...newTasks,...tasks]);
          setView("tasks");
        }}>📌 → Tâches ({(selected.packages||[]).reduce((s,p)=>s+(p.actions||[]).length,0)})</button>
        <button className="btn" style={{background:"#00796b",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>{
          const tr={id:uuid(),title:selected.title,description:selected.summary||"",createdAt:selected.date||new Date().toISOString().slice(0,10),packages:(selected.packages||[]).map(p=>({...p,id:uuid(),actions:(p.actions||[]).map(a=>({...a,id:uuid(),completedAt:a.status==="done"?a.completedAt||"":""}))}))}
          ;saveX([tr,...trackers]);setSelTracker(tr);setView("tracker-detail");
        }}>📊 → Tracker</button>
      </div>}

      {view==="detail"&&selected&&editMode&&<div className="sticky-bar">
        <span className="sb-title">✏️ {selected.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>setSelected({...selected,packages:[...(selected.packages||[]),newPkg()]})}>＋ Groupe</button>
        <div style={{flex:1}}/>
        <button className="btn" style={{background:"transparent",color:"#f87171",border:"1px solid #7f1d1d",fontSize:12}} onClick={()=>{if(confirm(`Supprimer "${selected.title}" ?`))delRec(selected.id);}}>🗑️ Supprimer</button>
        <button className="btn" style={{background:"transparent",color:"#ccc",border:"1px solid #555",fontSize:12}} onClick={()=>setEditMode(false)}>✕ Annuler</button>
        <button className="btn" style={{background:"#c9a84c",color:"#1c1c1e",fontWeight:700,fontSize:12}} onClick={()=>updRec(selected)}>💾 Sauvegarder</button>
      </div>}

      {view==="new"&&<div className="sticky-bar">
        <span className="sb-title">➕ {form.title||"Nouveau MoM"}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={aP}>＋ Groupe</button>
        <button className="btn" style={{background:"transparent",color:"#ccc",border:"1px solid #555",fontSize:12}} onClick={()=>setView("dashboard")}>Annuler</button>
        <button className="btn" disabled={!form.title.trim()} style={{background:form.title.trim()?"#c9a84c":"#555",color:form.title.trim()?"#1c1c1e":"#999",fontWeight:700,fontSize:12}} onClick={addRec}>💾 Enregistrer</button>
      </div>}

      {view==="tracker-detail"&&selTracker&&<div className="sticky-bar">
        <span className="sb-title">📊 {selTracker.title}</span>
        <button className="btn" style={{background:"#2a2a2a",color:"#ccc",border:"1px solid #444",fontSize:12}} onClick={()=>{
          const newG=newPkg();
          const updated={...selTracker,packages:[...(selTracker.packages||[]),newG]};
          saveX(trackers.map(t=>t.id===selTracker.id?updated:t));setSelTracker(updated);
        }}>＋ Groupe</button>
        <div style={{flex:1}}/>
        <button className="btn" style={{background:"transparent",color:"#f87171",border:"1px solid #7f1d1d",fontSize:12}} onClick={()=>{if(confirm(`Supprimer "${selTracker.title}" ?`))delTracker(selTracker.id);}}>🗑️ Supprimer</button>
        <button className="btn" style={{background:"#00796b",color:"#fff",fontWeight:700,fontSize:12}} onClick={()=>setTrackerForm({...selTracker})}>✏️ Modifier</button>
      </div>}

    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
