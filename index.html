<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCs-tnK2RfDn9I1gDTZNwMs3hkyNghDbRo",
    authDomain: "rt-mom.firebaseapp.com",
    projectId: "rt-mom",
    storageBucket: "rt-mom.firebasestorage.app",
    messagingSenderId: "210967214795",
    appId: "1:210967214795:web:c4ccc7b00fb7039b57f94e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function parseVal(val) {
    if (typeof val === "string") {
      try { return JSON.parse(val); } catch(e) { return val; }
    }
    return val;
  }

  window._db = {
    get: async (key) => {
      try {
        const snap = await getDoc(doc(db,"mom_data",key));
        return snap.exists() ? parseVal(snap.data().value) : null;
      }
      catch(e){ console.error("FB get",e); return null; }
    },
    set: async (key, value) => {
      try {
        const val = typeof value === "string" ? value : JSON.stringify(value);
        await setDoc(doc(db,"mom_data",key),{value: val});
      }
      catch(e){ console.error("FB set",e); }
    }
  };

  window._dbListen = function(key, cb){
    return onSnapshot(doc(db,"mom_data",key), function(snap){
      if(snap.exists()){
        var val = snap.data().value;
        if(typeof val === "string"){
          try { val = JSON.parse(val); } catch(e) {}
        }
        cb(val);
      }
    });
  };

  window.startListeners = function(listeners){
    if(!window._dbListen) return;
    Object.keys(listeners).forEach(function(key){
      window._dbListen(key, listeners[key]);
    });
  };

  window._dbReady = true;
  window.dispatchEvent(new Event("db-ready"));
</script>
<style>
/* ============================================================================
   Design tokens. One place for type, colour and spacing.
   Gold is a FILL colour: dark text on gold reads at 7.45:1, which is excellent.
   It is never used as small text on white (2.29:1) — --gold-ink exists for that.
   ============================================================================ */
:root{
  --font-display:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;

  --fs-micro:11px; --fs-small:12px; --fs-base:13px;
  --fs-large:15px; --fs-title:18px; --fs-page:24px;

  --ink:#16181d;        /* body text            */
  --ink-2:#4a4740;      /* secondary text       */
  --ink-3:#6f6b62;      /* meta, 4.6:1 on paper */
  --ink-4:#9b968b;      /* disabled only        */
  --paper:#f4f3f0;
  --surface:#ffffff;
  --rule:#ddd9cf;
  --rule-2:#efece5;

  --gold:#c9a84c;       /* brand fill, unchanged */
  --gold-dark:#b3913a;  /* fill, hover           */
  --gold-soft:#faf3e0;  /* tinted background     */
  --gold-ink:#8a6a1e;   /* gold AS TEXT, 5.05:1  */

  --blue:#0f5299; --blue-soft:#e8f0fe;
  --red:#b3302a;  --red-soft:#fbe6e8;
  --amber:#b35c00;--amber-soft:#fdf1e0;
  --green:#1e6b3a;--green-soft:#e6f2e9;

  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --shadow:0 2px 10px rgba(22,24,29,.07);
  --shadow-lg:0 18px 50px rgba(22,24,29,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);height:100vh;overflow:hidden;
  font-size:var(--fs-base);-webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01";}
/* Figures line up in columns: essential in a schedule and in date tables. */
input[type=date],input[type=number],.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table td,table th{font-variant-numeric:tabular-nums}
#app-banner{background:var(--surface);color:#c2410c;text-align:center;padding:11px 16px;font-size:var(--fs-small);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-family:var(--font-display);border-bottom:1.5px solid var(--rule-2);width:100%;box-sizing:border-box;}
.layout{display:flex;height:calc(100vh - 44px);overflow:hidden}

.leftnav .logo{font-family:var(--font-body);font-weight:700;color:var(--gold-ink);font-size:var(--fs-small);margin-bottom:10px;text-align:center;line-height:1.15;letter-spacing:0}
.navbtn{width:44px;height:44px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#888;transition:all .15s;font-size:18px;padding:0}
.navbtn span.lbl{font-family:var(--font-body);font-size:9.5px;font-weight:600;letter-spacing:.005em;line-height:1.15}
.navbtn:hover{background:#2a2a2a;color:#fff}
.navbtn.on{background:var(--gold);color:var(--ink)}
.navbtn.on span.lbl{color:var(--ink)}
.navbtn:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav-sep{width:30px;height:1px;background:#333;margin:4px 0}
/* Sub-entries of a grouped nav item: indented, smaller, with a hairline spine */

.ac-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border-radius:8px;border:1px solid #e8e6df;margin-bottom:6px;transition:all .12s}
.ac-item:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.05)}

input[type=text],input[type=date],input[type=number],textarea,select{font-family:var(--font-body);font-size:var(--fs-base);border:1.5px solid var(--rule);border-radius:var(--r-sm);padding:7px 10px;outline:none;background:var(--surface);color:var(--ink);width:100%;transition:border-color .12s,box-shadow .12s}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,82,153,.12)}

select{cursor:pointer}
label{font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}

/* The schedule needs a scrollbar you can actually grab */
.sched-wrap{scrollbar-width:auto;scrollbar-color:#c9a84c #f0ede6;}
.sched-wrap::-webkit-scrollbar{width:14px;height:14px}
.sched-wrap::-webkit-scrollbar-track{background:#f0ede6;border-radius:7px}
.sched-wrap::-webkit-scrollbar-thumb{background:#c9a84c;border-radius:7px;border:3px solid #f0ede6}
.sched-wrap::-webkit-scrollbar-thumb:hover{background:#b45309}
.sched-wrap::-webkit-scrollbar-corner{background:#f0ede6}
/* Pinned mirror of the schedule scrollbar: same look, always within reach */
/* Only the pinned bar shows a horizontal scrollbar — the one inside the box is hidden
   so there is never a second, unreachable bar. Vertical scrolling is untouched. */
.sched-wrap::-webkit-scrollbar:horizontal{height:0}
.sched-mirror{scrollbar-width:auto;scrollbar-color:#c9a84c #f0ede6;}
.sched-mirror::-webkit-scrollbar{height:14px}
.sched-mirror::-webkit-scrollbar-track{background:#f0ede6;border-radius:7px}

.fchip{height:26px;padding:0 12px;border-radius:20px;border:1.5px solid var(--rule);background:var(--surface);font-family:var(--font-body);font-size:var(--fs-small);font-weight:600;cursor:pointer;color:var(--ink-3);transition:background .12s,border-color .12s,color .12s;display:inline-flex;align-items:center}

@page{size:A4 landscape;margin:8mm;}
.sched-print-only{display:none;}
@media print{
  body.printing-schedule .leftnav,body.printing-schedule .rsidebar,body.printing-schedule .page-hdr,
  body.printing-schedule .fchip,body.printing-schedule .btn{display:none!important;}
  body.printing-schedule .sched-wrap{overflow:visible!important;max-height:none!important;height:auto!important;width:auto!important;}
  body.printing-schedule .content{overflow:visible!important;height:auto!important;}
  /* width:max-content lets every week column print; the JS zoom shrinks it to the sheet */
  body.printing-schedule table{width:max-content!important;max-width:none!important;table-layout:auto!important;}
  body.printing-schedule th,body.printing-schedule td{white-space:nowrap!important;}
  /* sticky columns/headers must not float over the printed page */
  body.printing-schedule th,body.printing-schedule td{position:static!important;}
  body.printing-schedule .layout,body.printing-schedule .main-area{display:block!important;overflow:visible!important;}
  body.printing-schedule .sched-print-only{display:block!important;margin-bottom:10px;}
  body.printing-schedule .sched-noprint{display:none!important;}
  /* the live scrolling table is replaced by the paginated print blocks */
  body.printing-schedule .sched-wrap{display:none!important;}
  body.printing-schedule table{font-size:7px!important;}
  body.printing-schedule th,body.printing-schedule td{padding:2px 3px!important;}
}
@media print{
  /* The schedule lives in a 62vh scroll box. Without this it prints only what was on
     screen, cropped left and right. */
  .sched-wrap{overflow:visible!important;max-height:none!important;height:auto!important;border:none!important;}
  .sched-wrap table{width:max-content!important;max-width:none!important;table-layout:auto!important;}
  .sched-mirror{display:none!important;}
  body .leftnav,body nav.leftnav,.layout .leftnav{display:none!important;width:0!important;min-width:0!important;}
  body .rsidebar,.layout .rsidebar,.rsidebar.open,.rsidebar.closed{display:none!important;width:0!important;min-width:0!important;}
  .mobile-qa-btn{display:none!important;}
  .layout{display:flex!important;height:auto!important;overflow:visible!important;}
  .main-area{width:100%!important;max-width:100%!important;height:auto!important;overflow:visible!important;flex:1 1 auto!important;}
  .main-area>*{height:auto!important;overflow:visible!important;}
  body,html,#root{overflow:visible!important;height:auto!important;background:white!important;font-size:9px!important;}
  *{box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .page-hdr button,.btn-sm{display:none!important;}
  table,.tbl{font-size:8px!important;width:100%!important;}
  table th,table td,.tbl th,.tbl td{padding:3px 4px!important;font-size:8px!important;white-space:nowrap!important;}
  /* the schedule keeps its own sizing: it is scaled as a whole, not squeezed per cell */
  .sched-wrap table th,.sched-wrap table td{font-size:inherit!important;}
}

/* ---------------------------------------------------------------------------
   Title block — the signature device.
   Borrowed from a drawing sheet: the same strip heads a tender on screen and a
   report on paper, so the two halves of this tool read as one document set.
   --------------------------------------------------------------------------- */
.titleblock{display:flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:var(--r-md);
  background:var(--surface);overflow:hidden;margin-bottom:16px}
.titleblock .tb-main{flex:1;min-width:0;padding:12px 16px}
.titleblock .tb-eyebrow{font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.titleblock h2{font-family:var(--font-display);font-weight:700;font-size:var(--fs-page);
  line-height:1.08;letter-spacing:-.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titleblock .tb-sub{font-size:var(--fs-small);color:var(--ink-3);margin-top:3px}
.titleblock .tb-cells{display:flex;border-left:1.5px solid var(--ink)}
.titleblock .tb-cell{padding:10px 15px;border-right:1px solid var(--rule);min-width:96px}
.titleblock .tb-cell:last-child{border-right:none}
.titleblock .tb-cell .k{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.titleblock .tb-cell .v{font-family:var(--font-mono);font-size:var(--fs-base);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.titleblock .tb-cell .v.gold{color:var(--gold-ink)}
.titleblock .tb-cell .v.red{color:var(--red)}
.titleblock .tb-cell .v.green{color:var(--green)}
.titleblock.accent{border-color:var(--gold);border-left-width:5px}
.titleblock.accent .tb-cells{border-left-color:var(--gold)}
@media(max-width:820px){
  .titleblock{flex-direction:column}
  .titleblock .tb-cells{border-left:none;border-top:1.5px solid var(--ink);overflow-x:auto}
}
/* Section heading used inside a sheet */
.sheet-h{display:flex;align-items:baseline;gap:9px;margin:22px 0 9px;padding-bottom:6px;
  border-bottom:1.5px solid var(--rule)}
.sheet-h h3{font-family:var(--font-display);font-weight:700;font-size:var(--fs-title);letter-spacing:-.005em}
.sheet-h .hint{font-size:var(--fs-small);color:var(--ink-3);font-weight:400}
.s-na{background:#f5f5f5!important;color:#aaa!important;border:1px solid #ddd!important;}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  function showErr(title,msg,stk){
    var pre=document.createElement("pre");
    pre.style.cssText="padding:24px;font-family:monospace;color:#c62828;white-space:pre-wrap;font-size:13px;background:#fff;margin:0";
    pre.textContent=title+":\n"+msg+"\n\nStack:\n"+(stk||"");
    document.body.innerHTML="";
    document.body.appendChild(pre);
  }
  function run(){
    fetch("app.js?v="+Date.now())
      .then(function(r){return r.text();})
      .then(function(src){
        try{
          var out=Babel.transform(src,{presets:["react"]}).code;
          eval(out);
        }catch(e){
          showErr("BABEL ERROR",e.message,e.stack);
        }
      })
      .catch(function(e){showErr("FETCH ERROR",e.message,"");});
  }
  function wait(){
    if(typeof Babel!=="undefined"&&typeof React!=="undefined"&&typeof ReactDOM!=="undefined"){
      if(window._dbReady)run();
      else window.addEventListener("db-ready",run,{once:true});
    }else setTimeout(wait,50);
  }
  window.addEventListener("error",function(e){
    var root=document.getElementById("root");
    if(!root||root.innerHTML===""){
      showErr("RUNTIME ERROR",(e.message||"Unknown")+"\nFile: "+(e.filename||"")+" L"+(e.lineno||""),(e.error&&e.error.stack)||"");
    }
  });
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",wait):wait();
})();
</script>
</body>
</html>
